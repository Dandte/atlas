<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATLAS Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0f0f1a',
            card: '#1a1a2e',
            border: '#2a2a3e',
            accent: '#00d4ff',
            'accent-dim': '#00a0cc',
            surface: '#16162a',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f0f1a; }
    ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4e; }
    .fade-in { animation: fadeIn 0.25s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 8px rgba(0,212,255,0.15); } 50% { box-shadow: 0 0 16px rgba(0,212,255,0.3); } }
    .glow { animation: pulse-glow 3s ease-in-out infinite; }
    .meter-bar { transition: width 0.6s ease-out; }
    input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(0,212,255,0.4); }
    .toggle-track { transition: background-color 0.2s; }
    .toggle-thumb { transition: transform 0.2s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    // ─── Socket Context ──────────────────────────────────────────
    const SocketContext = createContext(null);

    function SocketProvider({ children }) {
      const [socket, setSocket] = useState(null);
      const [connected, setConnected] = useState(false);

      useEffect(() => {
        const s = io({ transports: ['websocket', 'polling'] });
        s.on('connect', () => setConnected(true));
        s.on('disconnect', () => setConnected(false));
        setSocket(s);
        return () => s.disconnect();
      }, []);

      return (
        <SocketContext.Provider value={{ socket, connected }}>
          {children}
        </SocketContext.Provider>
      );
    }

    function useSocket(event, handler) {
      const { socket } = useContext(SocketContext);
      useEffect(() => {
        if (!socket) return;
        socket.on(event, handler);
        return () => socket.off(event, handler);
      }, [socket, event, handler]);
    }

    function useSocketConnected() {
      return useContext(SocketContext).connected;
    }

    // ─── API Helper ──────────────────────────────────────────────
    async function api(path, opts = {}) {
      try {
        const res = await fetch(`/api${path}`, {
          headers: { 'Content-Type': 'application/json' },
          ...opts,
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body?.error || `${res.status} ${res.statusText}`);
        }
        return await res.json();
      } catch (err) {
        console.error(`API ${path}:`, err);
        throw err;
      }
    }

    // ─── Shared Components ───────────────────────────────────────
    function Card({ children, className = '', glow = false }) {
      return (
        <div className={`bg-card border border-border rounded-xl p-5 ${glow ? 'glow' : ''} ${className}`}>
          {children}
        </div>
      );
    }

    function StatCard({ label, value, sub, icon }) {
      return (
        <Card>
          <div className="flex items-start justify-between">
            <div>
              <p className="text-gray-400 text-xs uppercase tracking-wider mb-1">{label}</p>
              <p className="text-2xl font-semibold text-white">{value ?? '...'}</p>
              {sub && <p className="text-gray-500 text-xs mt-1">{sub}</p>}
            </div>
            {icon && <span className="text-accent text-xl opacity-60">{icon}</span>}
          </div>
        </Card>
      );
    }

    function Meter({ label, value, max, unit = '' }) {
      const pct = max ? Math.min(100, (value / max) * 100) : 0;
      const color = pct > 90 ? 'bg-red-500' : pct > 70 ? 'bg-yellow-500' : 'bg-accent';
      return (
        <div className="mb-3">
          <div className="flex justify-between text-xs mb-1">
            <span className="text-gray-400">{label}</span>
            <span className="text-gray-300 mono">{typeof value === 'number' ? value.toFixed(1) : value}{unit} / {typeof max === 'number' ? max.toFixed(1) : max}{unit}</span>
          </div>
          <div className="h-2 bg-surface rounded-full overflow-hidden">
            <div className={`h-full rounded-full meter-bar ${color}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function Toggle({ enabled, onToggle, disabled = false }) {
      return (
        <button
          onClick={onToggle}
          disabled={disabled}
          className={`relative w-11 h-6 rounded-full toggle-track ${enabled ? 'bg-accent' : 'bg-gray-600'} ${disabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}`}
        >
          <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow toggle-thumb ${enabled ? 'transform translate-x-5' : ''}`} />
        </button>
      );
    }

    function Button({ children, onClick, variant = 'primary', size = 'md', disabled = false, className = '' }) {
      const base = 'rounded-lg font-medium transition-all duration-150 inline-flex items-center justify-center';
      const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-5 py-2.5 text-base' };
      const variants = {
        primary: 'bg-accent text-black hover:bg-accent-dim active:scale-95',
        danger: 'bg-red-600 text-white hover:bg-red-700 active:scale-95',
        ghost: 'bg-transparent text-gray-400 hover:text-white hover:bg-surface border border-border',
      };
      return (
        <button
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${sizes[size]} ${variants[variant]} ${disabled ? 'opacity-40 cursor-not-allowed' : ''} ${className}`}
        >
          {children}
        </button>
      );
    }

    function SearchInput({ value, onChange, placeholder }) {
      return (
        <input
          type="text"
          value={value}
          onChange={e => onChange(e.target.value)}
          placeholder={placeholder}
          className="bg-surface border border-border rounded-lg px-4 py-2 text-sm text-white placeholder-gray-500 w-full max-w-xs"
        />
      );
    }

    function Tabs({ tabs, active, onChange }) {
      return (
        <div className="flex gap-1 bg-surface rounded-lg p-1 mb-5">
          {tabs.map(t => (
            <button
              key={t}
              onClick={() => onChange(t)}
              className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${active === t ? 'bg-card text-accent' : 'text-gray-400 hover:text-white'}`}
            >
              {t}
            </button>
          ))}
        </div>
      );
    }

    function EmptyState({ message }) {
      return <div className="text-center text-gray-500 py-12 text-sm">{message}</div>;
    }

    function Spinner() {
      return (
        <div className="flex justify-center py-12">
          <div className="w-8 h-8 border-2 border-accent border-t-transparent rounded-full animate-spin" />
        </div>
      );
    }

    // ─── Utility ─────────────────────────────────────────────────
    function formatUptime(seconds) {
      if (!seconds && seconds !== 0) return '...';
      const d = Math.floor(seconds / 86400);
      const h = Math.floor((seconds % 86400) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (d > 0) return `${d}d ${h}h ${m}m`;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      return `${m}m ${s}s`;
    }

    function formatBytes(bytes) {
      if (bytes == null) return '...';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
      return (bytes / 1073741824).toFixed(2) + ' GB';
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleString();
    }

    function truncate(s, n = 80) {
      if (!s) return '';
      return s.length > n ? s.slice(0, n) + '...' : s;
    }

    // ─── NAV ICONS (inline SVG paths) ───────────────────────────
    const icons = {
      Overview: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1',
      Memory: 'M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7c0-2 1-3 3-3h10c2 0 3 1 3 3M4 7h16M9 11h6M9 15h4',
      Agents: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z',
      Skills: 'M13 10V3L4 14h7v7l9-11h-7z',
      Tasks: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4',
      Logs: 'M4 6h16M4 10h16M4 14h16M4 18h10',
      Config: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z',
      Prompt: 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z',
      Analytics: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z',
      Pipelines: 'M13 5l7 7-7 7M5 5l7 7-7 7',
      Goals: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z',
      Knowledge: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z',
      Plugins: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4',
      Users: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z',
      'A/B Tests': 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z',
      Behavior: 'M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z',
      'Domótica': 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4m-4 0a1 1 0 01-1-1v-3a1 1 0 011-1h2a1 1 0 011 1v3a1 1 0 01-1 1',
      SubAgents: 'M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z',
      Pairing: 'M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z',
      Costs: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
      MCP: 'M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z',
      Feedback: 'M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z',
      Live: 'M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z',
      Integrations: 'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1',
    };

    function NavIcon({ name }) {
      const d = icons[name] || icons.Overview;
      return (
        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
          <path strokeLinecap="round" strokeLinejoin="round" d={d} />
        </svg>
      );
    }

    // ─── Translation Map ─────────────────────────────────────────
    const pageLabels = {
      Overview: 'General',
      Analytics: 'Analíticas',
      Memory: 'Memoria',
      Agents: 'Agentes',
      Skills: 'Skills',
      Tasks: 'Tareas',
      Channels: 'Canales',
      Pipelines: 'Pipelines',
      Goals: 'Objetivos',
      Knowledge: 'Conocimiento',
      Plugins: 'Plugins',
      Users: 'Usuarios',
      'A/B Tests': 'Pruebas A/B',
      Behavior: 'Comportamiento',
      'Domótica': 'Domótica',
      SubAgents: 'Sub-Agentes',
      Pairing: 'Acceso DM',
      Costs: 'Costos API',
      MCP: 'MCP',
      Integrations: 'Integraciones',
      Feedback: 'Feedback',
      Live: 'En Vivo',
      Prompt: 'Prompt',
      Logs: 'Logs',
      Config: 'Ajustes',
    };

    // ─── Sidebar ─────────────────────────────────────────────────
    function Sidebar({ page, setPage, collapsed, setCollapsed }) {
      const connected = useSocketConnected();
      const pages = ['Overview', 'Analytics', 'Memory', 'Agents', 'Skills', 'Tasks', 'Channels', 'Pipelines', 'Goals', 'Knowledge', 'Plugins', 'Users', 'A/B Tests', 'Behavior', 'Domótica', 'n8n', 'SubAgents', 'Pairing', 'Costs', 'MCP', 'Integrations', 'Feedback', 'Live', 'Prompt', 'Logs', 'Config'];

      return (
        <aside className={`fixed top-0 left-0 h-screen bg-card border-r border-border flex flex-col z-30 transition-all duration-200 ${collapsed ? 'w-16' : 'w-56'}`}>
          {/* Logo */}
          <div className="flex items-center gap-3 px-4 h-16 border-b border-border shrink-0">
            <div className="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center shrink-0">
              <span className="text-accent font-bold text-sm">A</span>
            </div>
            {!collapsed && <span className="font-semibold text-white tracking-wide text-sm">ATLAS</span>}
          </div>

          {/* Nav Items */}
          <nav className="flex-1 py-3 px-2 overflow-y-auto">
            {pages.map(p => (
              <button
                key={p}
                onClick={() => setPage(p)}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg mb-0.5 text-sm transition-colors ${page === p ? 'bg-accent/10 text-accent' : 'text-gray-400 hover:text-white hover:bg-surface'}`}
              >
                <NavIcon name={p} />
                {!collapsed && <span>{pageLabels[p] || p}</span>}
              </button>
            ))}
          </nav>

          {/* Footer */}
          <div className="px-3 py-3 border-t border-border shrink-0">
            <div className="flex items-center gap-2 px-2">
              <span className={`w-2 h-2 rounded-full ${connected ? 'bg-green-400' : 'bg-red-400'}`} />
              {!collapsed && <span className="text-xs text-gray-500">{connected ? 'Conectado' : 'Desconectado'}</span>}
            </div>
            <button
              onClick={() => setCollapsed(c => !c)}
              className="w-full mt-2 text-gray-500 hover:text-white text-xs py-1 rounded hover:bg-surface transition-colors"
            >
              {collapsed ? '>>' : '<< Colapsar'}
            </button>
          </div>
        </aside>
      );
    }

    // ─── Mobile Nav ──────────────────────────────────────────────
    function MobileNav({ page, setPage, open, setOpen }) {
      const pages = ['Overview', 'Analytics', 'Memory', 'Agents', 'Skills', 'Tasks', 'Channels', 'Pipelines', 'Goals', 'Knowledge', 'Plugins', 'Users', 'A/B Tests', 'Behavior', 'Domótica', 'n8n', 'SubAgents', 'Pairing', 'Costs', 'MCP', 'Integrations', 'Feedback', 'Live', 'Prompt', 'Logs', 'Config'];
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 lg:hidden">
          <div className="absolute inset-0 bg-black/60" onClick={() => setOpen(false)} />
          <div className="absolute left-0 top-0 h-full w-64 bg-card border-r border-border p-4">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center">
                <span className="text-accent font-bold text-sm">A</span>
              </div>
              <span className="font-semibold text-white tracking-wide text-sm">ATLAS</span>
            </div>
            {pages.map(p => (
              <button
                key={p}
                onClick={() => { setPage(p); setOpen(false); }}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg mb-0.5 text-sm transition-colors ${page === p ? 'bg-accent/10 text-accent' : 'text-gray-400 hover:text-white hover:bg-surface'}`}
              >
                <NavIcon name={p} />
                <span>{pageLabels[p] || p}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: OVERVIEW
    // ═══════════════════════════════════════════════════════════════
    function OverviewPage() {
      const [data, setData] = useState(null);
      const [stats, setStats] = useState(null);
      const [toolExecs, setToolExecs] = useState([]);
      const [routingEvents, setRoutingEvents] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        api('/overview').then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
      }, []);

      const handleStats = useCallback((s) => {
        setStats(prev => ({ ...prev, ...s }));
      }, []);

      const handleTool = useCallback((t) => {
        setToolExecs(prev => [t, ...prev].slice(0, 50));
      }, []);

      const handleRouting = useCallback((r) => {
        setRoutingEvents(prev => [r, ...prev].slice(0, 20));
      }, []);

      useSocket('system_stats', handleStats);
      useSocket('tool_execution', handleTool);
      useSocket('agent_routing', handleRouting);

      if (loading) return <Spinner />;
      if (!data) return <EmptyState message="Error al cargar datos del sistema." />;

      const sys = stats || data.system || {};
      const mem = data.memory || {};

      return (
        <div className="fade-in space-y-6">
          {/* Stat Cards */}
          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
            <StatCard label="Tiempo Activo" value={formatUptime(stats?.uptime ?? data.uptime)} />
            <StatCard label="Versión" value={data.version || 'N/A'} />
            <StatCard label="Tam. BD" value={formatBytes(stats?.dbSize ?? data.dbSize)} />
            <StatCard label="Episodios" value={mem.episodes ?? 0} />
            <StatCard label="Hechos" value={mem.facts ?? 0} />
            <StatCard label="Canales" value={data.channels?.length ?? 0} />
          </div>

          {/* System Resources */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">Recursos del Sistema</h3>
              <Meter label="Carga CPU" value={sys.cpuLoad ?? 0} max={100} unit="%" />
              <Meter label="Memoria" value={sys.memoryUsed ?? (stats?.memoryUsed ?? 0)} max={(sys.memoryTotal ?? ((sys.memoryUsed ?? 0) + (stats?.memoryFree ?? 0))) || 1} unit=" GB" />

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: MEMORY
    // ═══════════════════════════════════════════════════════════════
    function MemoryPage() {
      const [tab, setTab] = useState('Facts');
      const [facts, setFacts] = useState([]);
      const [episodes, setEpisodes] = useState([]);
      const [reflections, setReflections] = useState([]);
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(false);

      const loadFacts = useCallback(() => {
        setLoading(true);
        const qs = new URLSearchParams();
        if (search) qs.set('search', search);
        qs.set('limit', '100');
        api(`/memory/facts?${qs}`).then(setFacts).catch(() => setFacts([])).finally(() => setLoading(false));
      }, [search]);

      const loadEpisodes = useCallback(() => {
        setLoading(true);
        api('/memory/episodes').then(setEpisodes).catch(() => setEpisodes([])).finally(() => setLoading(false));
      }, []);

      const loadReflections = useCallback(() => {
        setLoading(true);
        api('/memory/reflections').then(setReflections).catch(() => setReflections([])).finally(() => setLoading(false));
      }, []);

      useEffect(() => {
        if (tab === 'Facts') loadFacts();
        else if (tab === 'Episodes') loadEpisodes();
        else if (tab === 'Reflections') loadReflections();
      }, [tab, loadFacts, loadEpisodes, loadReflections]);

      const deleteFact = async (id) => {
        if (!confirm('¿Eliminar este hecho?')) return;
        try {
          await api(`/memory/facts/${id}`, { method: 'DELETE' });
          setFacts(prev => prev.filter(f => (f.id || f._id) !== id));
        } catch (err) {
          alert('Error al eliminar hecho.');
        }
      };

      return (
        <div className="fade-in">
          <Tabs tabs={['Facts', 'Episodes', 'Reflections']} active={tab} onChange={(t) => setTab(t)} />

          {tab === 'Facts' && (
            <div>
              <div className="flex gap-3 mb-4 flex-wrap items-center">
                <SearchInput value={search} onChange={setSearch} placeholder="Buscar hechos..." />
                <Button onClick={loadFacts} variant="ghost" size="sm">Buscar</Button>
              </div>
              {loading ? <Spinner /> : facts.length === 0 ? <EmptyState message="No se encontraron hechos." /> : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left text-gray-500 text-xs uppercase tracking-wider">
                        <th className="pb-3 pr-4">Hecho</th>
                        <th className="pb-3 pr-4 w-24">Fuente</th>
                        <th className="pb-3 pr-4 w-24">Confianza</th>
                        <th className="pb-3 pr-4 w-40">Creado</th>
                        <th className="pb-3 w-16"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {facts.map((f, i) => (
                        <tr key={f.id || i} className={i % 2 === 0 ? 'bg-surface/50' : ''}>
                          <td className="py-2.5 pr-4 text-gray-200">
                            <span className="text-accent text-xs">{truncate(f.key || '', 50)}</span>
                            {f.value ? <span className="text-gray-300 ml-2">{truncate(f.value, 80)}</span> : null}
                          </td>
                          <td className="py-2.5 pr-4 text-gray-400">{f.source || '...'}</td>
                          <td className="py-2.5 pr-4 mono text-gray-400">{f.confidence != null ? (f.confidence * 100).toFixed(0) + '%' : '...'}</td>
                          <td className="py-2.5 pr-4 text-gray-500 text-xs">{formatDate(f.createdAt)}</td>
                          <td className="py-2.5">
                            <Button variant="danger" size="sm" onClick={() => deleteFact(f.id)}>Elim</Button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {tab === 'Episodes' && (
            <div>
              {loading ? <Spinner /> : episodes.length === 0 ? <EmptyState message="No se encontraron episodios." /> : (
                <div className="space-y-3">
                  {episodes.map((ep, i) => (
                    <Card key={ep.id || ep._id || i}>
                      <div className="flex justify-between items-start mb-2">
                        <h4 className="text-white text-sm font-medium">{ep.title || ep.summary || `Episode ${i + 1}`}</h4>
                        <span className="text-xs text-gray-500">{formatDate(ep.createdAt || ep.timestamp)}</span>
                      </div>
                      <p className="text-gray-400 text-xs">{truncate(ep.content || ep.description || ep.summary || '', 200)}</p>
                      {ep.channel && <span className="inline-block mt-2 px-2 py-0.5 bg-surface rounded text-xs text-gray-500">{ep.channel}</span>}
                    </Card>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === 'Reflections' && (
            <div>
              {loading ? <Spinner /> : reflections.length === 0 ? <EmptyState message="No se encontraron reflexiones." /> : (
                <div className="space-y-3">
                  {reflections.map((r, i) => (
                    <Card key={r.id || r._id || i}>
                      <div className="flex justify-between items-start mb-2">
                        <span className="text-accent text-xs uppercase tracking-wider">{r.type || 'Reflexión'}</span>
                        <span className="text-xs text-gray-500">{formatDate(r.createdAt || r.timestamp)}</span>
                      </div>
                      <p className="text-gray-200 text-sm">{r.content || r.text || r.insight || ''}</p>
                      {r.source && <p className="text-gray-500 text-xs mt-2">Fuente: {r.source}</p>}
                    </Card>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: AGENTS
    // ═══════════════════════════════════════════════════════════════
    function AgentsPage() {
      const [agents, setAgents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toggling, setToggling] = useState(null);

      useEffect(() => {
        api('/agents').then(setAgents).catch(() => setAgents([])).finally(() => setLoading(false));
      }, []);

      const toggleAgent = async (agent) => {
        const id = agent.id || agent._id || agent.name;
        setToggling(id);
        try {
          const result = await api(`/agents/${id}/toggle`, { method: 'POST' });
          setAgents(prev => prev.map(a => {
            const aid = a.id || a._id || a.name;
            return aid === id ? { ...a, enabled: result.enabled ?? !a.enabled } : a;
          }));
        } catch (err) {
          alert('Error al cambiar agente.');
        } finally {
          setToggling(null);
        }
      };

      if (loading) return <Spinner />;
      if (agents.length === 0) return <EmptyState message="No hay agentes registrados." />;

      return (
        <div className="fade-in grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          {agents.map((agent, i) => {
            const id = agent.id || agent._id || agent.name;
            const stats = agent.stats || {};
            return (
              <Card key={id || i}>
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <h3 className="text-white font-medium text-sm">{agent.name || agent.id}</h3>
                    {agent.description && <p className="text-gray-400 text-xs mt-1">{truncate(agent.description, 80)}</p>}
                  </div>
                  <Toggle
                    enabled={agent.enabled !== false}
                    onToggle={() => toggleAgent(agent)}
                    disabled={toggling === id}
                  />
                </div>
                <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-border">
                  <div className="text-center">
                    <p className="text-white text-lg font-semibold">{stats.totalExecutions ?? 0}</p>
                    <p className="text-gray-500 text-xs">Ejecuciones</p>
                  </div>
                  <div className="text-center">
                    <p className="text-green-400 text-lg font-semibold">{stats.successes ?? 0}</p>
                    <p className="text-gray-500 text-xs">Éxitos</p>
                  </div>
                  <div className="text-center">
                    <p className="text-red-400 text-lg font-semibold">{stats.failures ?? 0}</p>
                    <p className="text-gray-500 text-xs">Fallos</p>
                  </div>
                </div>
                {agent.preferredModel && (
                  <div className="mt-2 flex justify-between text-xs text-gray-500">
                    <span>Modelo: <span className="text-gray-300">{agent.preferredModel}</span></span>
                    {stats.avgExecutionMs > 0 && <span>Prom: <span className="text-gray-300">{stats.avgExecutionMs}ms</span></span>}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: SKILLS
    // ═══════════════════════════════════════════════════════════════
    function SkillsPage() {
      const [skills, setSkills] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toggling, setToggling] = useState(null);

      useEffect(() => {
        api('/skills').then(data => {
          console.log('[SkillsPage] loaded', data.length, 'skills');
          setSkills(data);
        }).catch(err => {
          console.error('[SkillsPage] error loading skills', err);
          setSkills([]);
        }).finally(() => setLoading(false));
      }, []);

      const toggleSkill = async (skill) => {
        if (skill.source === 'builtin') return;
        const name = skill.name || skill.id;
        setToggling(name);
        try {
          const result = await api('/skills/' + name + '/toggle', { method: 'POST' });
          setSkills(prev => prev.map(s => (s.name || s.id) === name ? { ...s, enabled: result.enabled ?? !s.enabled } : s));
        } catch (err) {
          alert('Error al cambiar skill.');
        } finally {
          setToggling(null);
        }
      };

      if (loading) return React.createElement(Spinner, null);
      if (skills.length === 0) return React.createElement(EmptyState, { message: 'No hay skills cargadas. Reinicia ATLAS para cargar las skills integradas.' });

      const builtinSkills = skills.filter(s => s.source === 'builtin');
      const forgedSkills = skills.filter(s => s.source === 'forged');

      const renderSkillRow = (s, i) => {
        const name = s.name || s.id;
        const isForged = s.source === 'forged';
        return (
          <tr key={name || i} className={i % 2 === 0 ? 'bg-surface/50' : ''}>
            <td className="py-3 pr-4">
              <div>
                <span className="text-white">{s.displayName || name}</span>
                {s.description ? <p className="text-gray-500 text-xs mt-0.5">{truncate(s.description, 80)}</p> : null}
              </div>
            </td>
            <td className="py-3 pr-4">
              <span className={'px-2 py-0.5 rounded text-xs ' + (s.enabled !== false ? 'bg-green-500/10 text-green-400' : 'bg-gray-600/20 text-gray-500')}>
                {s.enabled !== false ? 'Activa' : 'Deshabilitada'}
              </span>
            </td>
            {isForged ? (
              <td className="py-3">
                <Toggle enabled={s.enabled !== false} onToggle={() => toggleSkill(s)} disabled={toggling === name} />
              </td>
            ) : (
              <td className="py-3"></td>
            )}
          </tr>
        );
      };

      return (
        <div className="fade-in space-y-6">
          {builtinSkills.length > 0 ? (
            <div>
              <div className="flex items-center gap-2 mb-3">
                <h3 className="text-white text-sm font-medium">Skills Integradas</h3>
                <span className="px-2 py-0.5 rounded text-xs bg-accent/10 text-accent">{builtinSkills.length}</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-gray-500 text-xs uppercase tracking-wider">
                      <th className="pb-3 pr-4">Nombre</th>
                      <th className="pb-3 pr-4 w-28">Estado</th>
                      <th className="pb-3 w-20"></th>
                    </tr>
                  </thead>
                  <tbody>{builtinSkills.map(renderSkillRow)}</tbody>
                </table>
              </div>
            </div>
          ) : null}
          {forgedSkills.length > 0 ? (
            <div>
              <div className="flex items-center gap-2 mb-3">
                <h3 className="text-white text-sm font-medium">Skills Forjadas</h3>
                <span className="px-2 py-0.5 rounded text-xs bg-purple-500/10 text-purple-400">{forgedSkills.length}</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-gray-500 text-xs uppercase tracking-wider">
                      <th className="pb-3 pr-4">Nombre</th>
                      <th className="pb-3 pr-4 w-28">Estado</th>
                      <th className="pb-3 w-20">Cambiar</th>
                    </tr>
                  </thead>
                  <tbody>{forgedSkills.map(renderSkillRow)}</tbody>
                </table>
              </div>
            </div>
          ) : null}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: TASKS
    // ═══════════════════════════════════════════════════════════════
    function TasksPage() {
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toggling, setToggling] = useState(null);
      const [running, setRunning] = useState(null);
      const [taskEvents, setTaskEvents] = useState([]);

      useEffect(() => {
        api('/tasks').then(setTasks).catch(() => setTasks([])).finally(() => setLoading(false));
      }, []);

      const handleTaskExec = useCallback((evt) => {
        setTaskEvents(prev => [evt, ...prev].slice(0, 30));
      }, []);

      useSocket('task_execution', handleTaskExec);

      const toggleTask = async (task) => {
        const id = task.id || task._id || task.name;
        setToggling(id);
        try {
          const result = await api(`/tasks/${id}/toggle`, { method: 'POST' });
          setTasks(prev => prev.map(t => {
            const tid = t.id || t._id || t.name;
            return tid === id ? { ...t, enabled: result.enabled ?? !t.enabled } : t;
          }));
        } catch (err) {
          alert('Error al cambiar tarea.');
        } finally {
          setToggling(null);
        }
      };

      const runTask = async (task) => {
        const id = task.id || task._id || task.name;
        setRunning(id);
        try {
          await api(`/tasks/${id}/run`, { method: 'POST' });
        } catch (err) {
          alert('Error al ejecutar tarea.');
        } finally {
          setTimeout(() => setRunning(null), 1500);
        }
      };

      const deleteTask = async (task) => {
        const id = task.id || task._id || task.name;
        if (!confirm(`¿Eliminar tarea "${task.name || id}"?`)) return;
        try {
          const result = await api(`/tasks/${id}`, { method: 'DELETE' });
          if (result.deleted) {
            // Refetch from server to ensure consistent state
            const updated = await api('/tasks');
            setTasks(updated);
          } else {
            alert('Tarea no encontrada.');
          }
        } catch (err) {
          alert('Error al eliminar tarea.');
        }
      };

      if (loading) return <Spinner />;
      if (tasks.length === 0) return <EmptyState message="No hay tareas programadas." />;

      return (
        <div className="fade-in space-y-6">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-gray-500 text-xs uppercase tracking-wider">
                  <th className="pb-3 pr-4">Tarea</th>
                  <th className="pb-3 pr-4 w-32">Programación</th>
                  <th className="pb-3 pr-4 w-40">Última Ejecución</th>
                  <th className="pb-3 pr-4 w-28">Estado</th>
                  <th className="pb-3 pr-4 w-20">Cambiar</th>
                  <th className="pb-3 pr-4 w-24"></th>
                  <th className="pb-3 w-16"></th>
                </tr>
              </thead>
              <tbody>
                {tasks.map((t, i) => {
                  const id = t.id || t._id || t.name;
                  return (
                    <tr key={id || i} className={i % 2 === 0 ? 'bg-surface/50' : ''}>
                      <td className="py-3 pr-4">
                        <span className="text-white">{t.name || id}</span>
                        {t.description && <p className="text-gray-500 text-xs mt-0.5">{truncate(t.description, 60)}</p>}
                      </td>
                      <td className="py-3 pr-4 mono text-gray-400 text-xs">{t.schedule || t.cron || '...'}</td>
                      <td className="py-3 pr-4 text-gray-500 text-xs">{formatDate(t.lastRun || t.lastExecuted)}</td>
                      <td className="py-3 pr-4">
                        <span className={`px-2 py-0.5 rounded text-xs ${t.enabled !== false ? 'bg-green-500/10 text-green-400' : 'bg-gray-600/20 text-gray-500'}`}>
                          {t.enabled !== false ? 'Activa' : 'Deshabilitada'}
                        </span>
                      </td>
                      <td className="py-3 pr-4">
                        <Toggle
                          enabled={t.enabled !== false}
                          onToggle={() => toggleTask(t)}
                          disabled={toggling === id}
                        />
                      </td>
                      <td className="py-3 pr-4">
                        <Button
                          size="sm"
                          variant="ghost"
                          onClick={() => runTask(t)}
                          disabled={running === id}
                        >
                          {running === id ? 'Ejecutando...' : 'Ejecutar'}
                        </Button>
                      </td>
                      <td className="py-3">
                        <Button size="sm" variant="danger" onClick={() => deleteTask(t)}>Elim</Button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Recent Task Executions */}
          {taskEvents.length > 0 && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-3">Ejecuciones Recientes <span className="text-xs text-gray-500 font-normal ml-1">tiempo real</span></h3>
              <div className="max-h-48 overflow-y-auto space-y-1.5">
                {taskEvents.map((evt, i) => (
                  <div key={i} className="flex items-center justify-between text-xs py-1.5 px-2 rounded bg-surface">
                    <div className="flex items-center gap-2">
                      <span className={`w-1.5 h-1.5 rounded-full ${evt.success ? 'bg-green-400' : 'bg-red-400'}`} />
                      <span className="text-gray-200 mono">{evt.taskName}</span>
                    </div>
                    <span className="text-gray-500">{truncate(evt.result || '', 40)}</span>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: LOGS
    // ═══════════════════════════════════════════════════════════════
    function LogsPage() {
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [autoScroll, setAutoScroll] = useState(true);
      const [filter, setFilter] = useState('all');
      const containerRef = useRef(null);

      useEffect(() => {
        api('/logs?lines=200').then(data => {
          const entries = Array.isArray(data) ? data : [];
          setLogs(entries);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      const handleLog = useCallback((entry) => {
        setLogs(prev => [...prev, entry].slice(-500));
      }, []);

      useSocket('log', handleLog);

      useEffect(() => {
        if (autoScroll && containerRef.current) {
          containerRef.current.scrollTop = containerRef.current.scrollHeight;
        }
      }, [logs, autoScroll]);

      const levelColor = (level) => {
        const l = (level || '').toLowerCase();
        if (l === 'error' || l === 'fatal') return 'text-red-400';
        if (l === 'warn' || l === 'warning') return 'text-yellow-400';
        if (l === 'info') return 'text-accent';
        if (l === 'debug') return 'text-gray-500';
        return 'text-gray-400';
      };

      const levelBg = (level) => {
        const l = (level || '').toLowerCase();
        if (l === 'error' || l === 'fatal') return 'bg-red-400/10';
        if (l === 'warn' || l === 'warning') return 'bg-yellow-400/10';
        return '';
      };

      const filteredLogs = filter === 'all' ? logs : logs.filter(l => (l.level || '').toLowerCase() === filter);

      return (
        <div className="fade-in flex flex-col h-full">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <div className="flex gap-1.5">
              {['all', 'error', 'warn', 'info', 'debug'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilter(f)}
                  className={`px-3 py-1.5 rounded text-xs font-medium transition-colors ${filter === f ? 'bg-accent/20 text-accent' : 'text-gray-500 hover:text-white bg-surface'}`}
                >
                  {f.toUpperCase()}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs text-gray-500">{filteredLogs.length} entradas</span>
              <label className="flex items-center gap-2 text-xs text-gray-400 cursor-pointer">
                <input
                  type="checkbox"
                  checked={autoScroll}
                  onChange={e => setAutoScroll(e.target.checked)}
                  className="accent-accent"
                />
                Auto-scroll
              </label>
            </div>
          </div>

          {loading ? <Spinner /> : (
            <div
              ref={containerRef}
              className="flex-1 bg-surface border border-border rounded-lg overflow-y-auto mono text-xs leading-relaxed"
              style={{ minHeight: '400px', maxHeight: 'calc(100vh - 220px)' }}
            >
              {filteredLogs.length === 0 ? (
                <div className="text-gray-500 text-center py-12">Sin entradas de log.</div>
              ) : (
                <table className="w-full">
                  <tbody>
                    {filteredLogs.map((log, i) => (
                      <tr key={i} className={`${levelBg(log.level)} hover:bg-white/[0.02]`}>
                        <td className="py-1 px-3 text-gray-600 whitespace-nowrap align-top w-20">{log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : ''}</td>
                        <td className={`py-1 px-2 whitespace-nowrap align-top w-14 font-medium ${levelColor(log.level)}`}>{(log.level || 'LOG').toUpperCase().padEnd(5)}</td>
                        <td className="py-1 px-2 text-gray-300 break-all">{log.message || JSON.stringify(log)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: SETTINGS / CONFIGURATION
    // ═══════════════════════════════════════════════════════════════
    function SettingRow({ setting, value, isDirty, showPw, onTogglePw, onChange }) {
      const { label, description, type } = setting;

      if (type === 'boolean') {
        return (
          <div className="flex items-center justify-between py-1">
            <div>
              <span className={`text-sm ${isDirty ? 'text-accent font-medium' : 'text-white'}`}>{label}</span>
              {description && <p className="text-xs text-gray-500">{description}</p>}
            </div>
            <Toggle enabled={value === 'true'} onToggle={() => onChange(value === 'true' ? 'false' : 'true')} />
          </div>
        );
      }

      if (type === 'password') {
        return (
          <div className="py-1">
            <label className={`text-sm ${isDirty ? 'text-accent font-medium' : 'text-white'}`}>{label}</label>
            {description && <p className="text-xs text-gray-500 mb-1">{description}</p>}
            <div className="flex gap-2">
              <input
                type={showPw ? 'text' : 'password'}
                value={value}
                onChange={e => onChange(e.target.value)}
                className="flex-1 bg-surface border border-border rounded-lg px-3 py-1.5 text-sm text-white mono"
                placeholder={setting.hasValue ? '(configurado)' : '(vacío)'}
              />
              <button onClick={onTogglePw} className="px-2 text-gray-400 hover:text-white text-xs border border-border rounded-lg hover:bg-surface transition-colors">
                {showPw ? 'Ocultar' : 'Mostrar'}
              </button>
            </div>
          </div>
        );
      }

      if (type === 'number') {
        return (
          <div className="py-1">
            <label className={`text-sm ${isDirty ? 'text-accent font-medium' : 'text-white'}`}>{label}</label>
            {description && <p className="text-xs text-gray-500 mb-1">{description}</p>}
            <input
              type="number"
              value={value}
              onChange={e => onChange(e.target.value)}
              className="w-36 bg-surface border border-border rounded-lg px-3 py-1.5 text-sm text-white mono"
            />
          </div>
        );
      }

      // string
      return (
        <div className="py-1">
          <label className={`text-sm ${isDirty ? 'text-accent font-medium' : 'text-white'}`}>{label}</label>
          {description && <p className="text-xs text-gray-500 mb-1">{description}</p>}
          <input
            type="text"
            value={value}
            onChange={e => onChange(e.target.value)}
            className="w-full bg-surface border border-border rounded-lg px-3 py-1.5 text-sm text-white mono"
          />
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: CHANNELS (Multi-instance WhatsApp)
    // ═══════════════════════════════════════════════════════════════
    function ChannelsPage() {
      const { socket } = useContext(SocketContext) || {};
      const [channels, setChannels] = useState([]);
      const [waInstances, setWaInstances] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showAdd, setShowAdd] = useState(false);
      const [qrModal, setQrModal] = useState(null); // { channelId, qrDataUrl }
      const [newInst, setNewInst] = useState({ id: '', displayName: '', phoneHint: '', allowedNumbers: '', monitorEnabled: true });
      const [actionLoading, setActionLoading] = useState('');

      const loadData = useCallback(async () => {
        try {
          const [ch, wa] = await Promise.all([
            api('/channels'),
            api('/channels/whatsapp'),
          ]);
          setChannels(ch);
          setWaInstances(wa);
        } catch (e) { console.error(e); }
        setLoading(false);
      }, []);

      useEffect(() => { loadData(); }, [loadData]);

      // Socket.IO real-time updates
      useEffect(() => {
        if (!socket) return;
        const onStatus = (data) => {
          setWaInstances(prev => prev.map(inst =>
            `whatsapp:${inst.id}` === data.channelId ? { ...inst, status: data.status } : inst
          ));
          setChannels(prev => prev.map(ch =>
            ch.id === data.channelId ? { ...ch, status: data.status } : ch
          ));
        };
        const onQR = (data) => {
          setQrModal({ channelId: data.channelId, qrDataUrl: data.qrDataUrl });
        };
        const onList = () => { loadData(); };

        socket.on('channel_status', onStatus);
        socket.on('channel_qr', onQR);
        socket.on('channel_list', onList);
        return () => {
          socket.off('channel_status', onStatus);
          socket.off('channel_qr', onQR);
          socket.off('channel_list', onList);
        };
      }, [socket, loadData]);

      const statusBadge = (status) => {
        const map = {
          connected: { bg: 'bg-green-500/20', text: 'text-green-400', label: 'Conectado' },
          connecting: { bg: 'bg-yellow-500/20', text: 'text-yellow-400', label: 'Conectando...' },
          disconnected: { bg: 'bg-red-500/20', text: 'text-red-400', label: 'Desconectado' },
          qr_pending: { bg: 'bg-blue-500/20', text: 'text-blue-400', label: 'QR Pendiente' },
        };
        const s = map[status] || map.disconnected;
        return React.createElement('span', { className: `px-2.5 py-1 rounded-full text-xs font-medium ${s.bg} ${s.text}` }, s.label);
      };

      const doAction = async (instanceId, action) => {
        const key = `${instanceId}:${action}`;
        setActionLoading(key);
        try {
          await api(`/channels/whatsapp/${instanceId}/${action}`, { method: 'POST' });
          await loadData();
        } catch (e) { console.error(e); }
        setActionLoading('');
      };

      const doDelete = async (instanceId) => {
        if (!confirm(`Eliminar instancia "${instanceId}"? Se borrara la sesion.`)) return;
        setActionLoading(`${instanceId}:delete`);
        try {
          await api(`/channels/whatsapp/${instanceId}`, { method: 'DELETE' });
          setQrModal(null);
          await loadData();
        } catch (e) { console.error(e); }
        setActionLoading('');
      };

      const handleCreate = async () => {
        if (!newInst.id || !newInst.displayName) return;
        setActionLoading('create');
        try {
          await api('/channels/whatsapp', {
            method: 'POST',
            body: JSON.stringify({
              id: newInst.id,
              displayName: newInst.displayName,
              phoneHint: newInst.phoneHint || undefined,
              allowedNumbers: newInst.allowedNumbers ? newInst.allowedNumbers.split('\n').map(s => s.trim()).filter(Boolean) : [],
              monitorEnabled: newInst.monitorEnabled,
            }),
          });
          setNewInst({ id: '', displayName: '', phoneHint: '', allowedNumbers: '', monitorEnabled: true });
          setShowAdd(false);
          await loadData();
        } catch (e) { alert(e.message || 'Error creating instance'); }
        setActionLoading('');
      };

      if (loading) return React.createElement('div', { className: 'text-gray-500 text-center py-20' }, 'Cargando canales...');

      // Separate non-whatsapp channels from WA instances
      const otherChannels = channels.filter(ch => !ch.id.startsWith('whatsapp:'));

      return (
        <div className="fade-in space-y-6 max-w-5xl">
          {/* QR Modal */}
          {qrModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center">
              <div className="absolute inset-0 bg-black/70" onClick={() => setQrModal(null)} />
              <div className="relative bg-card border border-border rounded-2xl p-8 max-w-sm w-full mx-4 text-center">
                <h3 className="text-white font-semibold text-lg mb-2">Escanea el QR</h3>
                <p className="text-gray-400 text-sm mb-4">{qrModal.channelId.replace('whatsapp:', '')}</p>
                <div className="bg-white rounded-xl p-4 inline-block">
                  <img src={qrModal.qrDataUrl} alt="WhatsApp QR" className="w-56 h-56" />
                </div>
                <p className="text-gray-500 text-xs mt-4">Abre WhatsApp &gt; Dispositivos vinculados &gt; Vincular dispositivo</p>
                <button onClick={() => setQrModal(null)} className="mt-4 px-4 py-2 bg-surface border border-border rounded-lg text-sm text-gray-300 hover:text-white transition-colors">
                  Cerrar
                </button>
              </div>
            </div>
          )}

          {/* Other Channels (CLI, Telegram, Web) */}
          {otherChannels.length > 0 && (
            <div>
              <h2 className="text-white font-semibold text-sm mb-3">Canales del Sistema</h2>
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                {otherChannels.map(ch => (
                  <div key={ch.id} className="bg-card border border-border rounded-xl p-4">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-white font-medium text-sm">{ch.displayName || ch.id}</span>
                      {statusBadge(ch.status)}
                    </div>
                    <p className="text-gray-500 text-xs mono">{ch.type}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* WhatsApp Instances */}
          <div>
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-white font-semibold text-sm">Instancias WhatsApp</h2>
              <button
                onClick={() => setShowAdd(!showAdd)}
                className="px-3 py-1.5 bg-accent/10 text-accent text-xs font-medium rounded-lg hover:bg-accent/20 transition-colors"
              >
                {showAdd ? 'Cancelar' : '+ Agregar WhatsApp'}
              </button>
            </div>

            {/* Add Instance Form */}
            {showAdd && (
              <div className="bg-card border border-accent/30 rounded-xl p-5 mb-4">
                <h3 className="text-white font-medium text-sm mb-3">Nueva Instancia WhatsApp</h3>
                <div className="grid gap-3 sm:grid-cols-2">
                  <div>
                    <label className="text-gray-400 text-xs block mb-1">ID (slug)</label>
                    <input
                      type="text" placeholder="personal, laboral..." value={newInst.id}
                      onChange={e => setNewInst({ ...newInst, id: e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '') })}
                      className="w-full bg-surface border border-border rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="text-gray-400 text-xs block mb-1">Nombre</label>
                    <input
                      type="text" placeholder="WhatsApp Personal" value={newInst.displayName}
                      onChange={e => setNewInst({ ...newInst, displayName: e.target.value })}
                      className="w-full bg-surface border border-border rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="text-gray-400 text-xs block mb-1">Telefono (referencia)</label>
                    <input
                      type="text" placeholder="+57 300 123 4567" value={newInst.phoneHint}
                      onChange={e => setNewInst({ ...newInst, phoneHint: e.target.value })}
                      className="w-full bg-surface border border-border rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="flex items-end gap-3">
                    <label className="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
                      <input type="checkbox" checked={newInst.monitorEnabled}
                        onChange={e => setNewInst({ ...newInst, monitorEnabled: e.target.checked })}
                        className="accent-accent" />
                      Monitor habilitado
                    </label>
                  </div>
                </div>
                <div className="mt-3">
                  <label className="text-gray-400 text-xs block mb-1">Numeros permitidos (uno por linea, vacio = todos)</label>
                  <textarea
                    rows={2} placeholder="573001234567&#10;573009876543" value={newInst.allowedNumbers}
                    onChange={e => setNewInst({ ...newInst, allowedNumbers: e.target.value })}
                    className="w-full bg-surface border border-border rounded-lg px-3 py-2 text-sm text-white mono"
                  />
                </div>
                <div className="flex justify-end mt-3">
                  <button
                    onClick={handleCreate}
                    disabled={!newInst.id || !newInst.displayName || actionLoading === 'create'}
                    className="px-4 py-2 bg-accent text-bg font-medium text-sm rounded-lg hover:bg-accent-dim transition-colors disabled:opacity-40"
                  >
                    {actionLoading === 'create' ? 'Creando...' : 'Crear y Conectar'}
                  </button>
                </div>
              </div>
            )}

            {/* Instance Cards */}
            {waInstances.length === 0 && !showAdd && (
              <div className="bg-card border border-border rounded-xl p-8 text-center">
                <p className="text-gray-500 text-sm">No hay instancias de WhatsApp configuradas.</p>
                <p className="text-gray-600 text-xs mt-1">Habilita WHATSAPP_ENABLED=true y agrega una instancia.</p>
              </div>
            )}

            <div className="grid gap-4">
              {waInstances.map(inst => (
                <div key={inst.id} className="bg-card border border-border rounded-xl p-5">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-lg bg-green-500/10 flex items-center justify-center">
                        <svg className="w-5 h-5 text-green-400" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                          <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a8 8 0 01-4.097-1.122l-.29-.174-3.01.895.81-2.96-.186-.3A8 8 0 1112 20z"/>
                        </svg>
                      </div>
                      <div>
                        <span className="text-white font-medium text-sm block">{inst.displayName}</span>
                        <span className="text-gray-500 text-xs mono">{inst.id}{inst.phoneHint ? ` — ${inst.phoneHint}` : ''}</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {statusBadge(inst.status)}
                      {inst.isOwner && (
                        <span className="px-2 py-1 rounded-full text-xs font-medium bg-accent/10 text-accent">Owner</span>
                      )}
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-3 text-xs text-gray-400 mb-4">
                    <span>Monitor: {inst.monitorEnabled ? 'ON' : 'OFF'}</span>
                    <span>Sesion: {inst.hasSession ? 'Guardada' : 'Sin sesion'}</span>
                    <span>Numeros: {inst.allowedNumbers?.length || 'Todos'}</span>
                  </div>

                  <div className="flex flex-wrap gap-2">
                    {(inst.status === 'disconnected' || inst.status === undefined) && (
                      <button
                        onClick={() => doAction(inst.id, 'connect')}
                        disabled={actionLoading === `${inst.id}:connect`}
                        className="px-3 py-1.5 bg-green-500/10 text-green-400 text-xs font-medium rounded-lg hover:bg-green-500/20 transition-colors disabled:opacity-40"
                      >
                        {actionLoading === `${inst.id}:connect` ? 'Conectando...' : 'Conectar'}
                      </button>
                    )}
                    {(inst.status === 'connected' || inst.status === 'qr_pending' || inst.status === 'connecting') && (
                      <button
                        onClick={() => doAction(inst.id, 'disconnect')}
                        disabled={actionLoading === `${inst.id}:disconnect`}
                        className="px-3 py-1.5 bg-red-500/10 text-red-400 text-xs font-medium rounded-lg hover:bg-red-500/20 transition-colors disabled:opacity-40"
                      >
                        {actionLoading === `${inst.id}:disconnect` ? 'Desconectando...' : 'Desconectar'}
                      </button>
                    )}
                    <button
                      onClick={() => doAction(inst.id, 'reconnect')}
                      disabled={!!actionLoading}
                      className="px-3 py-1.5 bg-surface border border-border text-gray-300 text-xs font-medium rounded-lg hover:text-white transition-colors disabled:opacity-40"
                    >
                      Reconectar
                    </button>
                    <button
                      onClick={() => doDelete(inst.id)}
                      disabled={!!actionLoading}
                      className="px-3 py-1.5 bg-surface border border-border text-gray-400 text-xs font-medium rounded-lg hover:text-red-400 hover:border-red-500/30 transition-colors disabled:opacity-40"
                    >
                      Eliminar
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ConfigPage() {
      const [categories, setCategories] = useState([]);
      const [activeCat, setActiveCat] = useState('general');
      const [values, setValues] = useState({});
      const [originalValues, setOriginalValues] = useState({});
      const [liveConfig, setLiveConfig] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [showRestart, setShowRestart] = useState(false);
      const [showPw, setShowPw] = useState({});
      const [providerModal, setProviderModal] = useState(null);

      const loadSettings = useCallback(() => {
        Promise.all([api('/settings'), api('/config')]).then(([data, cfg]) => {
          setCategories(data);
          setLiveConfig(cfg);
          const vals = {};
          const orig = {};
          data.forEach(cat => cat.settings.forEach(s => {
            vals[s.key] = s.value;
            orig[s.key] = s.value;
          }));
          setValues(vals);
          setOriginalValues(orig);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      useEffect(() => { loadSettings(); }, [loadSettings]);

      // Refresh live status every 15s
      useEffect(() => {
        const iv = setInterval(() => {
          api('/config').then(cfg => setLiveConfig(cfg)).catch(() => {});
        }, 15000);
        return () => clearInterval(iv);
      }, []);

      const dirtyKeys = useMemo(
        () => Object.keys(values).filter(k => values[k] !== originalValues[k]),
        [values, originalValues]
      );

      const handleSave = async () => {
        setSaving(true);
        try {
          for (const key of dirtyKeys) {
            await api(`/settings/${key}`, {
              method: 'PUT',
              body: JSON.stringify({ value: values[key] }),
            });
          }
          loadSettings();
          setShowRestart(true);
        } catch (err) {
          alert('Error: ' + err.message);
        }
        setSaving(false);
      };

      if (loading) return <Spinner />;

      const currentCat = categories.find(c => c.id === activeCat);
      const settings = currentCat?.settings || [];

      // Group settings by sub-group
      const groups = [];
      let currentGroup = null;
      settings.forEach(s => {
        const gName = s.group || '';
        if (!currentGroup || currentGroup.name !== gName) {
          currentGroup = { name: gName, items: [] };
          groups.push(currentGroup);
        }
        currentGroup.items.push(s);
      });

      // ── Provider status icons ──
