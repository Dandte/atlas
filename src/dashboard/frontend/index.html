    // ═══════════════════════════════════════════════════════════════
    //  PAGE: PIPELINES
    // ═══════════════════════════════════════════════════════════════
    function PipelinesPage() {
      const [pipelines, setPipelines] = useState([]);
      const [executions, setExecutions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showCreate, setShowCreate] = useState(false);
      const [form, setForm] = useState({ name: '', trigger_event: 'tool_executed', steps: '' });

      const load = () => {
        Promise.all([
          api('/pipelines').catch(() => []),
          api('/pipelines/executions').catch(() => []),
        ]).then(([p, e]) => {
          setPipelines(p || []); setExecutions(e || []);
          setLoading(false);
        });
      };
      useEffect(load, []);

      useSocket('pipeline_triggered', () => load());
      useSocket('pipeline_completed', () => load());

      const handleCreate = () => {
        let steps;
        try { steps = JSON.parse(form.steps); } catch { alert('Steps must be valid JSON array'); return; }
        api('/pipelines', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: form.name, trigger_event: form.trigger_event, steps }) })
          .then(() => { setShowCreate(false); setForm({ name: '', trigger_event: 'tool_executed', steps: '' }); load(); });
      };

      const toggle = (id) => api(`/pipelines/${id}/toggle`, { method: 'POST' }).then(load);
      const remove = (id) => { if (confirm('¿Eliminar pipeline?')) api(`/pipelines/${id}`, { method: 'DELETE' }).then(load); };
      const trigger = (id) => api(`/pipelines/${id}/trigger`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) }).then(load);

      if (loading) return <Spinner />;

      return (
        <div className="fade-in space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-sm text-gray-400">{pipelines.length} pipeline(s)</h2>
            <button onClick={() => setShowCreate(!showCreate)} className="px-3 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80">
              {showCreate ? 'Cancelar' : '+ Crear'}
            </button>
          </div>

          {showCreate && (
            <Card>
              <div className="space-y-3">
                <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Nombre del pipeline" className="w-full bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none" />
                <select value={form.trigger_event} onChange={e => setForm({...form, trigger_event: e.target.value})} className="w-full bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none">
                  <option value="tool_executed">Tool Ejecutado</option>
                  <option value="agent_routed">Agente Enrutado</option>
                  <option value="channel_connected">Canal Conectado</option>
                  <option value="schedule_triggered">Tarea Programada</option>
                  <option value="fact_learned">Hecho Aprendido</option>
                </select>
                <textarea value={form.steps} onChange={e => setForm({...form, steps: e.target.value})} placeholder='Steps JSON: [{"type":"send_message","params":{"channel":"telegram","message":"Hello"}}]' rows={4} className="w-full bg-surface text-white text-xs px-3 py-2 rounded-lg border border-border focus:border-accent outline-none mono" />
                <button onClick={handleCreate} className="px-4 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80">Crear Pipeline</button>
              </div>
            </Card>
          )}

          {pipelines.length === 0 ? <EmptyState message="No hay pipelines creados" /> : (
            <div className="space-y-3">
              {pipelines.map(p => (
                <Card key={p.id}>
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="text-sm font-semibold text-white">{p.name}</h3>
                      <p className="text-xs text-gray-500 mt-0.5">Trigger: <span className="text-gray-400">{p.trigger_event}</span> | Steps: {JSON.parse(p.steps || '[]').length} | Runs: {p.run_count || 0}</p>
                      {p.last_run && <p className="text-[10px] text-gray-600 mt-0.5">Last: {formatDate(p.last_run)}</p>}
                    </div>
                    <div className="flex gap-1.5">
                      <button onClick={() => trigger(p.id)} className="px-2 py-1 bg-blue-600/20 text-blue-400 text-[10px] rounded hover:bg-blue-600/30">Run</button>
                      <button onClick={() => toggle(p.id)} className={`px-2 py-1 text-[10px] rounded ${p.enabled ? 'bg-green-600/20 text-green-400' : 'bg-gray-600/20 text-gray-400'}`}>
                        {p.enabled ? 'ON' : 'OFF'}
                      </button>
                      <button onClick={() => remove(p.id)} className="px-2 py-1 bg-red-600/20 text-red-400 text-[10px] rounded hover:bg-red-600/30">Del</button>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}

          {executions.length > 0 && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-3">Ejecuciones Recientes</h3>
              <div className="space-y-1.5">
                {executions.slice(0, 20).map((e, i) => (
                  <div key={i} className="flex items-center justify-between text-xs py-1.5 border-b border-border last:border-0">
                    <span className="text-gray-400">{e.pipeline_id?.slice(0, 8)}</span>
                    <span className={e.success ? 'text-green-400' : 'text-red-400'}>{e.success ? 'OK' : 'FAIL'}</span>
                    <span className="text-gray-500">{e.steps_completed}/{e.total_steps} steps</span>
                    <span className="text-gray-600">{e.execution_ms}ms</span>
                    <span className="text-gray-600 text-[10px]">{formatDate(e.executed_at)}</span>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: GOALS
    // ═══════════════════════════════════════════════════════════════
    function GoalsPage() {
      const [goals, setGoals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showCreate, setShowCreate] = useState(false);
      const [form, setForm] = useState({ name: '', description: '', schedule: '0 */4 * * *' });
      const [selectedGoal, setSelectedGoal] = useState(null);
      const [executions, setExecutions] = useState([]);

      const load = () => {
        api('/goals').catch(() => []).then(g => { setGoals(g || []); setLoading(false); });
      };
      useEffect(load, []);

      useSocket('goal_progress', () => load());

      const handleCreate = () => {
        api('/goals', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) })
          .then(() => { setShowCreate(false); setForm({ name: '', description: '', schedule: '0 */4 * * *' }); load(); });
      };

      const runStep = (id) => api(`/goals/${id}/run`, { method: 'POST' }).then(load);
      const pause = (id) => api(`/goals/${id}/pause`, { method: 'POST' }).then(load);
      const resume = (id) => api(`/goals/${id}/resume`, { method: 'POST' }).then(load);
      const remove = (id) => { if (confirm('¿Eliminar objetivo?')) api(`/goals/${id}`, { method: 'DELETE' }).then(load); };

      const viewExecs = (id) => {
        setSelectedGoal(id);
        api(`/goals/${id}/executions`).then(e => setExecutions(e || []));
      };

      if (loading) return <Spinner />;

      return (
        <div className="fade-in space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-sm text-gray-400">{goals.length} objetivo(s)</h2>
            <button onClick={() => setShowCreate(!showCreate)} className="px-3 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80">
              {showCreate ? 'Cancelar' : '+ Nuevo Objetivo'}
            </button>
          </div>

          {showCreate && (
            <Card>
              <div className="space-y-3">
                <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Nombre del objetivo (ej: Monitorear competencia)" className="w-full bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none" />
                <textarea value={form.description} onChange={e => setForm({...form, description: e.target.value})} placeholder="Describe qué debe lograr este objetivo..." rows={3} className="w-full bg-surface text-white text-xs px-3 py-2 rounded-lg border border-border focus:border-accent outline-none" />
                <input value={form.schedule} onChange={e => setForm({...form, schedule: e.target.value})} placeholder="Programación cron (ej: 0 */4 * * *)" className="w-full bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none mono" />
                <button onClick={handleCreate} className="px-4 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80">Crear Objetivo</button>
              </div>
            </Card>
          )}

          {goals.length === 0 ? <EmptyState message="No hay objetivos configurados" /> : (
            <div className="space-y-3">
              {goals.map(g => (
                <Card key={g.id}>
                  <div className="flex items-start justify-between">
                    <div className="flex-1">
                      <div className="flex items-center gap-2">
                        <h3 className="text-sm font-semibold text-white">{g.name}</h3>
                        <span className={`px-1.5 py-0.5 text-[10px] rounded ${g.status === 'active' ? 'bg-green-600/20 text-green-400' : g.status === 'completed' ? 'bg-blue-600/20 text-blue-400' : 'bg-gray-600/20 text-gray-400'}`}>
                          {g.status}
                        </span>
                      </div>
                      {g.description && <p className="text-xs text-gray-500 mt-0.5">{truncate(g.description, 120)}</p>}
                      <div className="mt-2">
                        <div className="flex items-center gap-2">
                          <div className="flex-1 bg-surface rounded-full h-2 overflow-hidden">
                            <div className="bg-accent h-full rounded-full transition-all" style={{ width: ((g.progress || 0) * 100) + '%' }} />
                          </div>
                          <span className="text-[10px] text-gray-500">{((g.progress || 0) * 100).toFixed(0)}%</span>
                        </div>
                        {g.next_step && <p className="text-[10px] text-gray-600 mt-1">Next: {g.next_step}</p>}
                      </div>
                    </div>
                    <div className="flex gap-1.5 ml-3">
                      <button onClick={() => runStep(g.id)} className="px-2 py-1 bg-blue-600/20 text-blue-400 text-[10px] rounded hover:bg-blue-600/30">Paso</button>
                      {g.status === 'active' ? (
                        <button onClick={() => pause(g.id)} className="px-2 py-1 bg-yellow-600/20 text-yellow-400 text-[10px] rounded">Pausar</button>
                      ) : g.status === 'paused' ? (
                        <button onClick={() => resume(g.id)} className="px-2 py-1 bg-green-600/20 text-green-400 text-[10px] rounded">Reanudar</button>
                      ) : null}
                      <button onClick={() => viewExecs(g.id)} className="px-2 py-1 bg-surface text-gray-400 text-[10px] rounded hover:text-white">Log</button>
                      <button onClick={() => remove(g.id)} className="px-2 py-1 bg-red-600/20 text-red-400 text-[10px] rounded hover:bg-red-600/30">Del</button>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}

          {selectedGoal && executions.length > 0 && (
            <Card>
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-semibold text-white">Registro de Ejecuciones</h3>
                <button onClick={() => setSelectedGoal(null)} className="text-xs text-gray-500 hover:text-white">Cerrar</button>
              </div>
              <div className="space-y-1.5">
                {executions.map((e, i) => (
                  <div key={i} className="text-xs py-1.5 border-b border-border last:border-0">
                    <div className="flex items-center justify-between">
                      <span className={e.success ? 'text-green-400' : 'text-red-400'}>{e.success ? 'OK' : 'FAIL'}</span>
                      <span className="text-gray-600">{e.execution_ms}ms | {formatDate(e.executed_at)}</span>
                    </div>
                    {e.step_description && <p className="text-gray-500 mt-0.5">{truncate(e.step_description, 100)}</p>}
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: KNOWLEDGE GRAPH
    // ═══════════════════════════════════════════════════════════════
    function KnowledgePage() {
      const [entities, setEntities] = useState([]);
      const [relationships, setRelationships] = useState([]);
      const [stats, setStats] = useState(null);
      const [tab, setTab] = useState('entities');
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');

      const load = () => {
        Promise.all([
          api('/analytics/knowledge/entities').catch(() => []),
          api('/analytics/knowledge/relationships').catch(() => []),
          api('/analytics/knowledge/stats').catch(() => null),
        ]).then(([e, r, s]) => {
          setEntities(e || []); setRelationships(r || []); setStats(s);
          setLoading(false);
        });
      };
      useEffect(load, []);

      if (loading) return <Spinner />;

      const filteredEntities = search ? entities.filter(e => e.name.toLowerCase().includes(search.toLowerCase()) || e.type.toLowerCase().includes(search.toLowerCase())) : entities;
      const types = [...new Set(entities.map(e => e.type))];

      return (
        <div className="fade-in space-y-6">
          {stats && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <StatCard label="Entidades" value={stats.entities ?? 0} />
              <StatCard label="Relaciones" value={stats.relationships ?? 0} />
              <StatCard label="Tipos de Entidad" value={types.length} />
              <StatCard label="Tipos de Relación" value={stats.relationshipTypes ?? 0} />
            </div>
          )}

          <div className="flex gap-2 flex-wrap">
            {['entities', 'relationships'].map(t => (
              <button key={t} onClick={() => setTab(t)}
                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-colors ${tab === t ? 'bg-accent text-black' : 'bg-surface text-gray-400 hover:text-white'}`}>
                {t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            ))}
          </div>

          {tab === 'entities' && (
            <Card>
              <div className="flex items-center gap-3 mb-4">
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar entidades..." className="flex-1 bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none" />
              </div>
              {filteredEntities.length === 0 ? <EmptyState message="No se encontraron entidades" /> : (
                <div className="space-y-1.5">
                  {filteredEntities.slice(0, 50).map((e, i) => (
                    <div key={i} className="flex items-center justify-between text-xs py-2 border-b border-border last:border-0">
                      <div className="flex items-center gap-2">
                        <span className="px-1.5 py-0.5 bg-accent/10 text-accent text-[10px] rounded">{e.type}</span>
                        <span className="text-white">{e.name}</span>
                      </div>
                      {e.properties && <span className="text-gray-600 text-[10px]">{truncate(JSON.stringify(e.properties), 60)}</span>}
                    </div>
                  ))}
                </div>
              )}
            </Card>
          )}

          {tab === 'relationships' && (
            <Card>
              {relationships.length === 0 ? <EmptyState message="No se encontraron relaciones" /> : (
                <div className="space-y-1.5">
                  {relationships.slice(0, 50).map((r, i) => (
                    <div key={i} className="flex items-center gap-2 text-xs py-2 border-b border-border last:border-0">
                      <span className="text-blue-400">{r.source_name || r.source_id?.slice(0, 8)}</span>
                      <span className="text-gray-600">—[</span>
                      <span className="text-yellow-400">{r.type}</span>
                      <span className="text-gray-600">]→</span>
                      <span className="text-green-400">{r.target_name || r.target_id?.slice(0, 8)}</span>
                      {r.bidirectional ? <span className="text-gray-600 text-[10px]">(bidi)</span> : null}
                    </div>
                  ))}
                </div>
              )}
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: PLUGINS
    // ═══════════════════════════════════════════════════════════════
    function PluginsPage() {
      const [plugins, setPlugins] = useState([]);
      const [available, setAvailable] = useState([]);
      const [loading, setLoading] = useState(true);
      const [installing, setInstalling] = useState(null);
      const [showManual, setShowManual] = useState(false);
      const [installPath, setInstallPath] = useState('');

      const load = () => {
        Promise.all([
          api('/plugins').catch(() => []),
          api('/plugins/available').catch(() => []),
        ]).then(([inst, avail]) => {
          setPlugins(inst || []);
          setAvailable(avail || []);
          setLoading(false);
        });
      };
      useEffect(load, []);

      const installPlugin = (file) => {
        setInstalling(file);
        api('/plugins/install', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: file }) })
          .then(() => { setInstalling(null); load(); })
          .catch(e => { setInstalling(null); alert('Error: ' + e.message); });
      };

      const installManual = () => {
        if (!installPath.trim()) return;
        setInstalling(installPath);
        api('/plugins/install', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: installPath }) })
          .then(() => { setInstallPath(''); setShowManual(false); setInstalling(null); load(); })
          .catch(e => { setInstalling(null); alert('Error: ' + e.message); });
      };

      const toggle = (name, enabled) => api(`/plugins/${encodeURIComponent(name)}/toggle`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled })
      }).then(load);
      const remove = (name) => { if (confirm('Desinstalar ' + name + '?')) api(`/plugins/${encodeURIComponent(name)}`, { method: 'DELETE' }).then(load); };

      const pluginIcons = { 'expense-tracker': '$', 'server-monitor': '>', 'habit-tracker': '#', 'contacts-crm': '@', 'pomodoro': '~', 'code-snippets': '<>' };

      if (loading) return <Spinner />;

      return (
        <div className="fade-in space-y-8">

          {/* ── Available Plugins (Marketplace) ── */}
          {available.length > 0 && (
            <div className="space-y-4">
              <div className="flex items-center gap-2">
                <h2 className="text-sm font-semibold text-white">Marketplace</h2>
                <span className="text-[10px] text-gray-500">{available.length} disponible(s)</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {available.map(p => (
                  <Card key={p.file}>
                    <div className="space-y-3">
                      <div className="flex items-start justify-between">
                        <div className="flex items-center gap-2">
                          <div className="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center text-accent text-xs font-bold mono">
                            {pluginIcons[p.name] || p.name.charAt(0).toUpperCase()}
                          </div>
                          <div>
                            <h3 className="text-sm font-semibold text-white">{p.name}</h3>
                            <span className="text-[10px] text-gray-500">v{p.version} por {p.author || 'ATLAS'}</span>
                          </div>
                        </div>
                      </div>
                      {p.description && <p className="text-xs text-gray-400 leading-relaxed">{p.description}</p>}
                      {p.tools && p.tools.length > 0 && (
                        <div className="flex flex-wrap gap-1">
                          {p.tools.map(t => (
                            <span key={t} className="px-1.5 py-0.5 bg-accent/10 text-accent text-[10px] rounded mono">{t}</span>
                          ))}
                        </div>
                      )}
                      <button
                        onClick={() => installPlugin(p.file)}
                        disabled={installing === p.file}
                        className="w-full px-3 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
                      >
                        {installing === p.file ? 'Instalando...' : 'Instalar'}
                      </button>
                    </div>
                  </Card>
                ))}
              </div>
            </div>
          )}

          {/* ── Installed Plugins ── */}
          <div className="space-y-4">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <h2 className="text-sm font-semibold text-white">Instalados</h2>
                <span className="text-[10px] text-gray-500">{plugins.length} plugin(s)</span>
              </div>
              <button onClick={() => setShowManual(!showManual)} className="px-3 py-1.5 bg-surface border border-border text-gray-400 text-xs rounded-lg hover:border-accent hover:text-white transition-all">
                {showManual ? 'Cancelar' : 'Instalar manual'}
              </button>
            </div>

            {showManual && (
              <Card>
                <div className="flex gap-2">
                  <input value={installPath} onChange={e => setInstallPath(e.target.value)} placeholder="Ruta al archivo del plugin..." className="flex-1 bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none mono" onKeyDown={e => e.key === 'Enter' && installManual()} />
                  <button onClick={installManual} disabled={!!installing} className="px-4 py-2 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80 disabled:opacity-50">Instalar</button>
                </div>
              </Card>
            )}

            {plugins.length === 0 ? (
              <Card>
                <p className="text-xs text-gray-500 text-center py-4">
                  {available.length > 0 ? 'No hay plugins instalados. Elegí uno del marketplace de arriba.' : 'No hay plugins disponibles. Colocá archivos .ts en la carpeta plugins/'}
                </p>
              </Card>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {plugins.map(p => {
                  const toolsList = (() => { try { return JSON.parse(p.tools_provided || '[]'); } catch { return p.toolsProvided || []; } })();
                  return (
                    <Card key={p.name} className={!p.enabled ? 'opacity-60' : ''}>
                      <div className="flex items-start justify-between">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2">
                            <div className="w-7 h-7 rounded-lg bg-green-500/10 border border-green-500/20 flex items-center justify-center text-green-400 text-xs font-bold mono">
                              {pluginIcons[p.name] || p.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                              <h3 className="text-sm font-semibold text-white">{p.name}</h3>
                              <span className="text-[10px] text-gray-500">v{p.version || '?'}</span>
                            </div>
                          </div>
                          {p.description && <p className="text-xs text-gray-500 mt-1.5">{truncate(p.description, 90)}</p>}
                          {toolsList.length > 0 && (
                            <div className="flex flex-wrap gap-1 mt-2">
                              {toolsList.map(t => (
                                <span key={t} className="px-1.5 py-0.5 bg-surface text-gray-400 text-[10px] rounded mono">{t}</span>
                              ))}
                            </div>
                          )}
                          <p className="text-[10px] text-gray-600 mt-1.5">Instalado: {formatDate(p.installed_at || p.installedAt)}</p>
                        </div>
                        <div className="flex flex-col gap-1.5 ml-3">
                          <button onClick={() => toggle(p.name, !p.enabled)} className={`px-2.5 py-1 text-[10px] rounded font-medium transition-all ${p.enabled ? 'bg-green-600/20 text-green-400 hover:bg-green-600/30' : 'bg-gray-600/20 text-gray-400 hover:bg-gray-600/30'}`}>
                            {p.enabled ? 'ON' : 'OFF'}
                          </button>
                          <button onClick={() => remove(p.name)} className="px-2.5 py-1 bg-red-600/10 text-red-400/70 text-[10px] rounded hover:bg-red-600/20 hover:text-red-400 transition-all">
                            Quitar
                          </button>
                        </div>
                      </div>
                    </Card>
                  );
                })}
              </div>
            )}
          </div>

          {/* ── Install All ── */}
          {available.length > 1 && (
            <div className="flex justify-center">
              <button
                onClick={() => {
                  if (!confirm('Instalar todos los plugins disponibles?')) return;
                  setInstalling('all');
                  const chain = available.reduce((p, plugin) =>
                    p.then(() => api('/plugins/install', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: plugin.file }) }).catch(() => {})),
                    Promise.resolve()
                  );
                  chain.then(() => { setInstalling(null); load(); });
                }}
                disabled={!!installing}
                className="px-6 py-2 bg-accent/10 border border-accent/30 text-accent text-xs rounded-lg font-medium hover:bg-accent/20 disabled:opacity-50 transition-all"
              >
                {installing === 'all' ? 'Instalando todos...' : `Instalar todos (${available.length})`}
              </button>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: USERS
    // ═══════════════════════════════════════════════════════════════
    function UsersPage() {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedUser, setSelectedUser] = useState(null);
      const [permissions, setPermissions] = useState(null);

      const load = () => {
        api('/users').catch(() => []).then(u => { setUsers(u || []); setLoading(false); });
      };
      useEffect(load, []);

      const setRole = (id, role) => {
        api(`/users/${id}/role`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role }) }).then(load);
      };

      const remove = (id) => { if (confirm('¿Eliminar usuario?')) api(`/users/${id}`, { method: 'DELETE' }).then(load); };

      const viewPerms = (id) => {
        setSelectedUser(id);
        api(`/users/${id}/permissions`).then(p => setPermissions(p));
      };

      if (loading) return <Spinner />;

      const roleColors = {
        owner: 'bg-yellow-600/20 text-yellow-400',
        admin: 'bg-purple-600/20 text-purple-400',
        user: 'bg-blue-600/20 text-blue-400',
        guest: 'bg-gray-600/20 text-gray-400',
      };

      return (
        <div className="fade-in space-y-6">
          <h2 className="text-sm text-gray-400">{users.length} usuario(s) registrado(s)</h2>

          {users.length === 0 ? <EmptyState message="No hay usuarios aún. Se crean automáticamente en la primera interacción." /> : (
            <div className="space-y-3">
              {users.map(u => (
                <Card key={u.id}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-full bg-surface flex items-center justify-center text-sm font-semibold text-accent">
                        {(u.display_name || u.identifier || '?')[0].toUpperCase()}
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-sm text-white font-medium">{u.display_name || u.identifier}</span>
                          <span className={`px-1.5 py-0.5 text-[10px] rounded ${roleColors[u.role] || roleColors.guest}`}>{u.role}</span>
                        </div>
                        <p className="text-[10px] text-gray-600">ID: {u.identifier} | Último: {formatDate(u.last_seen)}</p>
                      </div>
                    </div>
                    <div className="flex gap-1.5">
                      <select value={u.role} onChange={e => setRole(u.id, e.target.value)} className="bg-surface text-white text-[10px] px-2 py-1 rounded border border-border outline-none">
                        <option value="owner">Propietario</option>
                        <option value="admin">Admin</option>
                        <option value="user">Usuario</option>
                        <option value="guest">Invitado</option>
                      </select>
                      <button onClick={() => viewPerms(u.id)} className="px-2 py-1 bg-surface text-gray-400 text-[10px] rounded hover:text-white">Permisos</button>
                      {u.role !== 'owner' && (
                        <button onClick={() => remove(u.id)} className="px-2 py-1 bg-red-600/20 text-red-400 text-[10px] rounded hover:bg-red-600/30">Del</button>
                      )}
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}

          {selectedUser && permissions && (
            <Card>
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-sm font-semibold text-white">Permisos del rol: <span className="text-accent">{permissions.role}</span></h3>
                <button onClick={() => setSelectedUser(null)} className="text-xs text-gray-500 hover:text-white">Cerrar</button>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                {(permissions.permissions || []).map((p, i) => (
                  <div key={i} className="flex items-center gap-2 text-xs py-1">
                    <span className={`w-2 h-2 rounded-full ${p.allowed ? 'bg-green-400' : 'bg-red-400'}`} />
                    <span className="text-gray-400">{p.permission}</span>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: A/B TESTS
    // ═══════════════════════════════════════════════════════════════
    function ABTestsPage() {
      const [tests, setTests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showCreate, setShowCreate] = useState(false);
      const [form, setForm] = useState({ name: '', sectionId: 'personality', variants: '' });
      const [results, setResults] = useState(null);
      const [selectedTest, setSelectedTest] = useState(null);

      const load = () => {
        api('/abtesting').catch(() => []).then(t => { setTests(t || []); setLoading(false); });
      };
      useEffect(load, []);

      const handleCreate = () => {
        let variants;
        try { variants = JSON.parse(form.variants); } catch { alert('Variants must be valid JSON array'); return; }
        api('/abtesting', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: form.name, sectionId: form.sectionId, variants }) })
          .then(() => { setShowCreate(false); setForm({ name: '', sectionId: 'personality', variants: '' }); load(); });
      };

      const start = (id) => api(`/abtesting/${id}/start`, { method: 'POST' }).then(load);
      const stop = (id) => api(`/abtesting/${id}/stop`, { method: 'POST' }).then(load);
      const remove = (id) => { if (confirm('¿Eliminar prueba?')) api(`/abtesting/${id}`, { method: 'DELETE' }).then(load); };
      const promote = (testId, variantId) => api(`/abtesting/${testId}/promote`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ variantId }) }).then(load);

      const viewResults = (id) => {
        setSelectedTest(id);
        api(`/abtesting/${id}/results`).then(r => setResults(r));
      };

      if (loading) return <Spinner />;

      const statusColors = {
        draft: 'bg-gray-600/20 text-gray-400',
        running: 'bg-green-600/20 text-green-400',
        stopped: 'bg-yellow-600/20 text-yellow-400',
        completed: 'bg-blue-600/20 text-blue-400',
      };

      return (
        <div className="fade-in space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-sm text-gray-400">{tests.length} prueba(s) A/B</h2>
            <button onClick={() => setShowCreate(!showCreate)} className="px-3 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80">
              {showCreate ? 'Cancelar' : '+ Nueva Prueba'}
            </button>
          </div>

          {showCreate && (
            <Card>
              <div className="space-y-3">
                <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Nombre de la prueba" className="w-full bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none" />
                <select value={form.sectionId} onChange={e => setForm({...form, sectionId: e.target.value})} className="w-full bg-surface text-white text-sm px-3 py-2 rounded-lg border border-border focus:border-accent outline-none">
                  <option value="personality">Sección de Personalidad</option>
                  <option value="capabilities">Sección de Capacidades</option>
                  <option value="rules">Sección de Reglas</option>
                  <option value="planning">Sección de Planificación</option>
                </select>
                <textarea value={form.variants} onChange={e => setForm({...form, variants: e.target.value})} placeholder='Variants JSON: [{"name":"A","content":"Be concise"},{"name":"B","content":"Be detailed"}]' rows={4} className="w-full bg-surface text-white text-xs px-3 py-2 rounded-lg border border-border focus:border-accent outline-none mono" />
                <button onClick={handleCreate} className="px-4 py-1.5 bg-accent text-black text-xs rounded-lg font-medium hover:bg-accent/80">Crear Prueba</button>
              </div>
            </Card>
          )}

          {tests.length === 0 ? <EmptyState message="No hay pruebas A/B creadas. Crea una para experimentar con diferentes secciones del prompt." /> : (
            <div className="space-y-3">
              {tests.map(t => (
                <Card key={t.id}>
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="text-sm font-semibold text-white">{t.name}</h3>
                        <span className={`px-1.5 py-0.5 text-[10px] rounded ${statusColors[t.status] || statusColors.draft}`}>{t.status}</span>
                      </div>
                      <p className="text-xs text-gray-500 mt-0.5">Section: <span className="text-gray-400">{t.section_id}</span> | Variants: {JSON.parse(t.variants || '[]').length}</p>
                      {t.winner_variant && <p className="text-xs text-green-400 mt-0.5">Winner: {t.winner_variant}</p>}
                    </div>
                    <div className="flex gap-1.5">
                      {t.status === 'draft' && <button onClick={() => start(t.id)} className="px-2 py-1 bg-green-600/20 text-green-400 text-[10px] rounded">Start</button>}
                      {t.status === 'running' && <button onClick={() => stop(t.id)} className="px-2 py-1 bg-yellow-600/20 text-yellow-400 text-[10px] rounded">Stop</button>}
                      <button onClick={() => viewResults(t.id)} className="px-2 py-1 bg-surface text-gray-400 text-[10px] rounded hover:text-white">Resultados</button>
                      <button onClick={() => remove(t.id)} className="px-2 py-1 bg-red-600/20 text-red-400 text-[10px] rounded hover:bg-red-600/30">Del</button>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}

          {selectedTest && results && (
            <Card>
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-sm font-semibold text-white">Resultados: <span className="text-accent">{results.test?.name}</span></h3>
                <button onClick={() => setSelectedTest(null)} className="text-xs text-gray-500 hover:text-white">Cerrar</button>
              </div>
              {results.variants && results.variants.length > 0 ? (
                <div className="space-y-3">
                  {results.variants.map((v, i) => (
                    <div key={i} className="p-3 bg-surface rounded-lg">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-sm text-white font-medium">{v.name}</span>
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-gray-400">Puntaje: <span className="text-accent">{(v.score ?? 0).toFixed(2)}</span></span>
                          {results.test?.status !== 'completed' && (
                            <button onClick={() => promote(selectedTest, v.id)} className="px-2 py-0.5 bg-accent/20 text-accent text-[10px] rounded hover:bg-accent/30">Promover</button>
                          )}
                        </div>
                      </div>
                      <div className="grid grid-cols-3 gap-2 text-xs text-gray-500">
                        <div>Asignaciones: <span className="text-gray-300">{v.assignments ?? 0}</span></div>
                        <div>Resp. Prom.: <span className="text-gray-300">{(v.avgResponseTime ?? 0).toFixed(0)}ms</span></div>
                        <div>Éxito Tools: <span className="text-gray-300">{(v.avgToolSuccess ?? 0).toFixed(1)}</span></div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : <EmptyState message="Sin resultados aún" />}
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: DOMÓTICA
    // ═══════════════════════════════════════════════════════════════
    // ─── Behavior Page ──────────────────────────────────────────
    function BehaviorPage() {
      const [tab, setTab] = useState('patterns');
      const [stats, setStats] = useState(null);
      const [patterns, setPatterns] = useState([]);
      const [suggestions, setSuggestions] = useState([]);
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [analyzing, setAnalyzing] = useState(false);

      useEffect(() => {
        Promise.all([
          api('/behavior/stats').catch(() => null),
          api('/behavior/patterns').catch(() => []),
          api('/behavior/suggestions').catch(() => []),
          api('/behavior/events?limit=50').catch(() => []),
        ]).then(([s, p, sg, e]) => {
          setStats(s);
          setPatterns(p);
          setSuggestions(sg);
          setEvents(e);
        }).finally(() => setLoading(false));
      }, []);

      const handleAnalyze = async () => {
        setAnalyzing(true);
        try {
          await api('/behavior/analyze', { method: 'POST' });
          const [s, p, sg] = await Promise.all([
            api('/behavior/stats').catch(() => null),
            api('/behavior/patterns').catch(() => []),
            api('/behavior/suggestions').catch(() => []),
          ]);
          setStats(s);
          setPatterns(p);
          setSuggestions(sg);
        } finally {
          setAnalyzing(false);
        }
      };

      const handleDismiss = async (id) => {
        await api(`/behavior/suggestions/${id}/dismiss`, { method: 'POST' });
        setSuggestions(prev => prev.map(s => s.id === id ? { ...s, status: 'dismissed' } : s));
      };

      const handleActedOn = async (id) => {
        await api(`/behavior/suggestions/${id}/acted`, { method: 'POST' });
        setSuggestions(prev => prev.map(s => s.id === id ? { ...s, status: 'acted_on' } : s));
      };

      if (loading) return <Spinner />;

      const statusColors = {
        pending: 'bg-yellow-500/20 text-yellow-400',
        delivered: 'bg-blue-500/20 text-blue-400',
        acted_on: 'bg-green-500/20 text-green-400',
        dismissed: 'bg-gray-500/20 text-gray-400',
        expired: 'bg-red-500/20 text-red-400',
      };

      const typeColors = {
        anticipation: 'bg-purple-500/20 text-purple-400',
        optimization: 'bg-cyan-500/20 text-cyan-400',
        warning: 'bg-orange-500/20 text-orange-400',
        reminder: 'bg-blue-500/20 text-blue-400',
      };

      return (
        <div className="fade-in space-y-6">
          {/* Stats */}
          {stats && (
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
              <StatCard label="Eventos totales" value={stats.totalEvents} />
              <StatCard label="Esta semana" value={stats.eventsThisWeek} />
              <StatCard label="Patrones activos" value={stats.activePatterns} />
              <StatCard label="Sugerencias" value={stats.totalSuggestions} />
              <StatCard label="Pendientes" value={stats.pendingSuggestions} />
              <StatCard label="Entregadas" value={stats.deliveredSuggestions} />
            </div>
          )}

          {/* Analyze button */}
          <div className="flex gap-3">
            <Button onClick={handleAnalyze} disabled={analyzing}>
              {analyzing ? 'Analizando...' : 'Analizar ahora'}
            </Button>
          </div>

          {/* Tabs */}
          <Tabs tabs={['patterns', 'suggestions', 'events', 'activity']}
            labels={{ patterns: 'Patrones', suggestions: 'Sugerencias', events: 'Eventos', activity: 'Actividad' }}
            active={tab} onChange={setTab} />

          {/* Patterns Tab */}
          {tab === 'patterns' && (
            <Card>
              <h3 className="text-white font-semibold mb-4">Patrones Detectados ({patterns.length})</h3>
              {patterns.length === 0 ? (
                <EmptyState text="No hay patrones detectados aún. Interactúa con ATLAS y ejecuta un análisis." />
              ) : (
                <div className="space-y-3">
                  {patterns.map((p, i) => (
                    <div key={i} className="flex items-center justify-between p-3 bg-surface rounded-lg">
                      <div className="flex-1">
                        <p className="text-white text-sm">{p.description}</p>
                        <div className="flex gap-2 mt-1">
                          <span className="text-xs px-2 py-0.5 rounded-full bg-accent/20 text-accent">{p.patternType}</span>
                          <span className="text-xs text-gray-500">{p.occurrences} ocurrencias</span>
                        </div>
                      </div>
                      <div className="text-right ml-4">
                        <div className="text-accent font-mono text-sm">{Math.round(p.confidence * 100)}%</div>
                        <div className="w-16 h-1.5 bg-gray-700 rounded-full mt-1">
                          <div className="h-full bg-accent rounded-full" style={{ width: `${p.confidence * 100}%` }} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          )}

          {/* Suggestions Tab */}
          {tab === 'suggestions' && (
            <Card>
              <h3 className="text-white font-semibold mb-4">Sugerencias Proactivas ({suggestions.length})</h3>
              {suggestions.length === 0 ? (
                <EmptyState text="No hay sugerencias generadas. Ejecuta un análisis para generar sugerencias." />
              ) : (
                <div className="space-y-3">
                  {suggestions.map((s) => (
                    <div key={s.id} className="p-3 bg-surface rounded-lg">
                      <div className="flex items-start justify-between">
                        <div className="flex-1">
                          <div className="flex gap-2 mb-1">
                            <span className={`text-xs px-2 py-0.5 rounded-full ${typeColors[s.type] || 'bg-gray-500/20 text-gray-400'}`}>{s.type}</span>
                            <span className={`text-xs px-2 py-0.5 rounded-full ${statusColors[s.status] || ''}`}>{s.status}</span>
                            <span className="text-xs text-gray-500">P{s.priority}</span>
                          </div>
                          <p className="text-white text-sm">{s.content}</p>
                          <p className="text-gray-500 text-xs mt-1">{formatDate(s.createdAt)}</p>
                        </div>
                        {s.status === 'pending' || s.status === 'delivered' ? (
                          <div className="flex gap-1 ml-3">
                            <button onClick={() => handleActedOn(s.id)} className="text-xs px-2 py-1 rounded bg-green-500/20 text-green-400 hover:bg-green-500/30">Hecho</button>
                            <button onClick={() => handleDismiss(s.id)} className="text-xs px-2 py-1 rounded bg-gray-500/20 text-gray-400 hover:bg-gray-500/30">Ignorar</button>
                          </div>
                        ) : null}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          )}

          {/* Events Tab */}
          {tab === 'events' && (
            <Card>
              <h3 className="text-white font-semibold mb-4">Eventos Recientes ({events.length})</h3>
              {events.length === 0 ? (
                <EmptyState text="No hay eventos registrados aún." />
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-gray-500 text-xs border-b border-border">
                        <th className="py-2 text-left">Tipo</th>
                        <th className="py-2 text-left">Clave</th>
                        <th className="py-2 text-left">Canal</th>
                        <th className="py-2 text-left">Día/Hora</th>
                        <th className="py-2 text-left">Fecha</th>
                      </tr>
                    </thead>
                    <tbody>
                      {events.map((e, i) => {
                        const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                        return (
                          <tr key={i} className="border-b border-border/50">
                            <td className="py-2"><span className="text-xs px-2 py-0.5 rounded-full bg-accent/20 text-accent">{e.eventType}</span></td>
