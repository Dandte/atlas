    function DomoticaPage() {
      const [devices, setDevices] = useState([]);
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedDevice, setSelectedDevice] = useState(null);
      const [cmdResult, setCmdResult] = useState(null);

      const load = () => {
        // Refresh from Tuya API first, then load events
        Promise.all([
          api('/domotica/refresh', { method: 'POST' }).catch(() =>
            api('/domotica/devices').catch(() => [])
          ),
          api('/domotica/events?limit=30').catch(() => []),
        ]).then(([d, e]) => {
          setDevices(Array.isArray(d) ? d : []);
          setEvents(e || []);
          setLoading(false);
        });
      };
      useEffect(load, []);

      // Real-time updates
      useSocket('device_state_changed', (data) => {
        setEvents(prev => [data, ...prev].slice(0, 30));
        // Update device state in-place
        setDevices(prev => prev.map(d =>
          d.tuya_id === data.deviceId
            ? { ...d, last_state: { ...(typeof d.last_state === 'object' ? d.last_state : {}), [data.property]: data.newValue } }
            : d
        ));
      });

      // Find the primary switch code for a device (matches backend detectSwitchCode)
      const SWITCH_PRIORITY = ['switch_led', 'switch_1', 'switch', 'switch_on', 'Power'];
      const findPrimarySwitch = (state) => {
        if (!state || typeof state !== 'object') return null;
        const keys = Object.keys(state);
        for (const code of SWITCH_PRIORITY) {
          if (keys.includes(code)) return code;
        }
        return keys.find(k => k.startsWith('switch')) || null;
      };

      // Get all switch codes for a device (for multi-gang)
      const getSwitchCodes = (state) => {
        if (!state || typeof state !== 'object') return [];
        return Object.keys(state).filter(k => k.startsWith('switch') || k === 'Power');
      };

      const sendCommand = async (deviceId, action, value, switchCode) => {
        setCmdResult(null);
        const body = { action };
        if (value !== undefined) body.value = value;
        if (switchCode) body.switch_code = switchCode;
        const result = await api(`/domotica/device/${deviceId}/command`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).catch(err => ({ success: false, error: err.message }));
        setCmdResult(result);
        setTimeout(() => setCmdResult(null), 3000);
        // After command, refresh real state from Tuya API (1s delay for Tuya to process)
        if (result && result.success) {
          setTimeout(() => {
            api('/domotica/refresh', { method: 'POST' }).then(d => {
              if (Array.isArray(d)) setDevices(d);
            }).catch(() => {});
          }, 1000);
        }
      };

      const categoryLabels = {
        dj: 'Luz', cz: 'Enchufe', wk: 'Termostato', cl: 'Cortina',
        ms: 'Cerradura', pir: 'Sensor PIR', wsdcg: 'Sensor T/H',
        camera: 'Cámara', kg: 'Interruptor', pc: 'Control remoto',
      };

      const getStatusSummary = (state) => {
        if (!state || typeof state !== 'object') return 'Sin datos';
        const entries = Object.entries(state);
        if (entries.length === 0) return 'Sin datos';
        const switches = entries.filter(([k]) => k.startsWith('switch') || k === 'Power');
        const others = entries.filter(([k]) => !(k.startsWith('switch') || k === 'Power'));
        const parts = [];
        // For multi-gang: show each switch state
        if (switches.length > 1) {
          parts.push(switches.map(([k, v]) => {
            const num = k.replace('switch_', 'S');
            return `${num}: ${v ? 'ON' : 'OFF'}`;
          }).join(' | '));
        } else if (switches.length === 1) {
          parts.push(switches[0][1] ? 'Encendido' : 'Apagado');
        }
        // Other properties
        for (const [k, v] of others.slice(0, 2)) {
          if (k === 'bright_value_v2') parts.push(`Brillo: ${Math.round(Number(v) / 10)}%`);
          else if (k === 'temp_current' || k === 'va_temperature') parts.push(`${(Number(v) / 10).toFixed(1)}°C`);
          else if (k === 'va_humidity' || k === 'humidity_value') parts.push(`${v}% humedad`);
          else if (k === 'pir' || k === 'presence_state') parts.push(v ? 'Movimiento' : 'Sin movimiento');
        }
        return parts.join(' | ') || 'Sin datos';
      };

      const isOn = (state) => {
        if (!state || typeof state !== 'object') return false;
        for (const key of Object.keys(state)) {
          if ((key.startsWith('switch') || key === 'Power') && state[key] === true) return true;
        }
        return false;
      };

      if (loading) return <div className="flex items-center justify-center h-64 text-gray-500">Cargando dispositivos...</div>;

      return (
        <div className="space-y-6 fade-in">
          {/* Command Result Toast */}
          {cmdResult && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2 rounded-lg text-sm ${cmdResult.success ? 'bg-green-600/90 text-white' : 'bg-red-600/90 text-white'}`}>
              {cmdResult.success ? cmdResult.output : cmdResult.error}
            </div>
          )}

          {/* Devices Grid */}
          <div>
            <h3 className="text-sm font-semibold text-white mb-3">Dispositivos ({devices.length})</h3>
            {devices.length === 0 ? (
              <Card><EmptyState message="No hay dispositivos. Configurá TUYA_ACCESS_KEY en .env" /></Card>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {devices.map(d => {
                  const state = typeof d.last_state === 'string' ? (() => { try { return JSON.parse(d.last_state); } catch { return null; } })() : d.last_state;
                  const switches = getSwitchCodes(state);
                  const isMultiGang = switches.length > 1;
                  const on = isOn(state);
                  return (
                    <Card key={d.tuya_id}>
                      <div className="flex items-start justify-between mb-3">
                        <div>
                          <h4 className="text-sm font-semibold text-white">{d.name}</h4>
                          <span className="text-[10px] text-gray-500">{categoryLabels[d.category] || d.category || 'Dispositivo'}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className={`w-2 h-2 rounded-full ${d.online ? 'bg-green-400' : 'bg-gray-500'}`} />
                          <span className="text-[10px] text-gray-500">{d.online ? 'Online' : 'Offline'}</span>
                        </div>
                      </div>

                      <div className="text-xs text-gray-400 mb-3 min-h-[20px]">
                        {getStatusSummary(state)}
                      </div>

                      <div className="flex items-center gap-2 flex-wrap">
                        {isMultiGang ? (
                          /* Multi-gang: one button per switch */
                          switches.map(sw => {
                            const swOn = state && state[sw] === true;
                            const label = sw.replace('switch_', 'S');
                            return (
                              <button key={sw}
                                onClick={() => sendCommand(d.tuya_id, swOn ? 'turn_off' : 'turn_on', undefined, sw)}
                                className={`px-3 py-1.5 text-[11px] rounded-lg font-medium transition-colors ${swOn ? 'bg-accent/20 text-accent hover:bg-accent/30' : 'bg-surface text-gray-400 hover:text-white hover:bg-surface'}`}
                              >
                                {label}: {swOn ? 'ON' : 'OFF'}
                              </button>
                            );
                          })
                        ) : (
                          /* Single switch: one toggle */
                          <button
                            onClick={() => sendCommand(d.tuya_id, on ? 'turn_off' : 'turn_on')}
                            className={`px-3 py-1.5 text-[11px] rounded-lg font-medium transition-colors ${on ? 'bg-accent/20 text-accent hover:bg-accent/30' : 'bg-surface text-gray-400 hover:text-white hover:bg-surface'}`}
                          >
                            {on ? 'Apagar' : 'Encender'}
                          </button>
                        )}
                        <button
                          onClick={() => setSelectedDevice(selectedDevice === d.tuya_id ? null : d.tuya_id)}
                          className="px-2 py-1.5 bg-surface text-gray-400 text-[11px] rounded-lg hover:text-white"
                        >
                          Detalle
                        </button>
                      </div>

                      {/* Detail panel */}
                      {selectedDevice === d.tuya_id && state && (
                        <div className="mt-3 pt-3 border-t border-border">
                          <div className="space-y-1">
                            {Object.entries(state).map(([k, v]) => (
                              <div key={k} className="flex justify-between text-[11px]">
                                <span className="text-gray-500 mono">{k}</span>
                                <span className="text-gray-300">{String(v)}</span>
                              </div>
                            ))}
                          </div>
                          {/* Quick actions for brightness */}
                          {(state.bright_value_v2 !== undefined) && (
                            <div className="mt-2 flex items-center gap-2">
                              <span className="text-[10px] text-gray-500">Brillo:</span>
                              {[10, 25, 50, 75, 100].map(b => (
                                <button key={b} onClick={() => sendCommand(d.tuya_id, 'set_brightness', b)}
                                  className="px-2 py-0.5 bg-surface text-gray-400 text-[10px] rounded hover:text-accent">{b}%</button>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </Card>
                  );
                })}
              </div>
            )}
          </div>

          {/* Events History */}
          <div>
            <h3 className="text-sm font-semibold text-white mb-3">Eventos recientes</h3>
            <Card>
              {events.length === 0 ? (
                <EmptyState message="Sin eventos de cambio de estado" />
              ) : (
                <div className="space-y-2 max-h-80 overflow-y-auto">
                  {events.map((e, i) => (
                    <div key={i} className="flex items-center justify-between text-xs py-1.5 border-b border-border/50 last:border-0">
                      <div className="flex items-center gap-2">
                        <span className="text-accent font-medium">{e.deviceName || e.device_name || e.deviceId}</span>
                        <span className="text-gray-500">{e.property}</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-gray-500">{String(e.old_value ?? e.oldValue ?? '')} → <span className="text-white">{String(e.new_value ?? e.newValue ?? '')}</span></span>
                        <span className="text-gray-600 text-[10px]">{e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : ''}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    // ─── n8n Integration Page ────────────────────────────
    function N8nPage() {
      const [workflows, setWorkflows] = useState([]);
      const [executions, setExecutions] = useState([]);
      const [status, setStatus] = useState(null);
      const [loading, setLoading] = useState(true);
      const [triggerModal, setTriggerModal] = useState(null);
      const [triggerPayload, setTriggerPayload] = useState('{}');

      const load = () => {
        setLoading(true);
        Promise.all([
          api('/n8n/status').catch(() => ({ connected: false })),
          api('/n8n/workflows').catch(() => []),
          api('/n8n/executions?limit=20').catch(() => []),
        ]).then(([s, w, e]) => {
          setStatus(s);
          setWorkflows(Array.isArray(w) ? w : []);
          setExecutions(Array.isArray(e) ? e : []);
          setLoading(false);
        });
      };

      useEffect(() => { load(); }, []);

      const triggerWorkflow = async (id) => {
        try {
          let payload = {};
          try { payload = JSON.parse(triggerPayload); } catch {}
          await api(`/n8n/workflows/${id}/trigger`, {
            method: 'POST',
            body: JSON.stringify({ payload }),
          });
          setTriggerModal(null);
          const e = await api('/n8n/executions?limit=20').catch(() => []);
          setExecutions(Array.isArray(e) ? e : []);
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const toggleWorkflow = async (id, active) => {
        try {
          await api(`/n8n/workflows/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ active }),
          });
          setWorkflows(ws => ws.map(w => w.id === id ? { ...w, active } : w));
        } catch (err) {
          alert('Error: ' + err.message);
        }
      };

      const testConnection = async () => {
        setLoading(true);
        try {
          const s = await api('/n8n/test-connection', { method: 'POST', body: '{}' });
          setStatus(prev => ({ ...prev, ...s }));
        } catch {}
        setLoading(false);
      };

      if (loading) return <div className="flex items-center justify-center h-64 text-gray-500">Cargando...</div>;

      return (
        <div className="fade-in space-y-6">
          {/* Connection Status */}
          <div className="bg-[#1a1a2e] rounded-xl border border-gray-800 p-5">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-white font-semibold text-lg">n8n Connection</h2>
              <div className="flex gap-2">
                <button onClick={testConnection} className="px-3 py-1.5 text-sm bg-cyan-500/10 text-cyan-400 rounded-lg hover:bg-cyan-500/20 transition">
                  Test Connection
                </button>
                <button onClick={load} className="px-3 py-1.5 text-sm bg-gray-700/50 text-gray-300 rounded-lg hover:bg-gray-700 transition">
                  Refresh
                </button>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <span className={`w-3 h-3 rounded-full ${status?.connected ? 'bg-green-500' : 'bg-red-500'}`}></span>
              <span className="text-gray-400 font-mono text-sm">{status?.url || 'Not configured'}</span>
              {status?.connected
                ? <span className="text-green-400 text-xs">Connected</span>
                : <span className="text-red-400 text-xs">{status?.error || 'Disconnected'}</span>
              }
            </div>
          </div>

          {/* Workflows */}
          <div className="bg-[#1a1a2e] rounded-xl border border-gray-800 p-5">
            <h2 className="text-white font-semibold text-lg mb-4">Workflows ({workflows.length})</h2>
            <div className="space-y-2">
              {workflows.map(w => (
                <div key={w.id} className="flex items-center justify-between bg-[#0f0f1a] rounded-lg px-4 py-3">
                  <div className="flex items-center gap-3">
                    <span className={`w-2 h-2 rounded-full ${w.active ? 'bg-green-500' : 'bg-gray-600'}`}></span>
                    <div>
                      <span className="text-white text-sm">{w.name}</span>
                      <span className="text-gray-600 text-xs ml-2 font-mono">#{w.id}</span>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => toggleWorkflow(w.id, !w.active)}
                      className={`px-2 py-1 text-xs rounded transition ${w.active ? 'bg-yellow-500/10 text-yellow-400 hover:bg-yellow-500/20' : 'bg-green-500/10 text-green-400 hover:bg-green-500/20'}`}
                    >
                      {w.active ? 'Deactivate' : 'Activate'}
                    </button>
                    <button
                      onClick={() => { setTriggerModal(w); setTriggerPayload('{}'); }}
                      className="px-2 py-1 text-xs bg-cyan-500/10 text-cyan-400 rounded hover:bg-cyan-500/20 transition"
                    >
                      Trigger
                    </button>
                  </div>
                </div>
              ))}
              {workflows.length === 0 && <p className="text-gray-600 text-sm">No workflows found. Verify n8n connection and API key.</p>}
            </div>
          </div>

          {/* Recent Executions */}
          <div className="bg-[#1a1a2e] rounded-xl border border-gray-800 p-5">
            <h2 className="text-white font-semibold text-lg mb-4">Recent Executions</h2>
            <div className="space-y-2">
              {executions.map((e, i) => (
                <div key={e.id || i} className="flex items-center justify-between bg-[#0f0f1a] rounded-lg px-4 py-2">
                  <div className="flex items-center gap-3">
                    <span className={`w-2 h-2 rounded-full ${e.finished ? (e.stoppedAt ? 'bg-green-500' : 'bg-red-500') : 'bg-yellow-500'}`}></span>
                    <span className="text-gray-400 text-xs font-mono">#{e.id}</span>
                    <span className="text-gray-300 text-sm">{e.workflowData?.name || `Workflow ${e.workflowId}`}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`text-xs ${e.finished ? (e.stoppedAt ? 'text-green-400' : 'text-red-400') : 'text-yellow-400'}`}>
                      {e.finished ? (e.stoppedAt ? 'Success' : 'Failed') : 'Running'}
                    </span>
                    <span className="text-gray-600 text-xs">{e.startedAt ? new Date(e.startedAt).toLocaleString() : ''}</span>
                  </div>
                </div>
              ))}
              {executions.length === 0 && <p className="text-gray-600 text-sm">No executions yet.</p>}
            </div>
          </div>

          {/* Trigger Modal */}
          {triggerModal && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm" onClick={() => setTriggerModal(null)}>
              <div className="bg-[#1a1a2e] border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl" onClick={e => e.stopPropagation()}>
                <h3 className="text-white font-semibold mb-1">Trigger Workflow</h3>
                <p className="text-gray-400 text-sm mb-4">{triggerModal.name} <span className="text-gray-600 font-mono">#{triggerModal.id}</span></p>
                <label className="block text-gray-400 text-sm mb-2">Payload (JSON)</label>
                <textarea
                  className="w-full bg-[#0f0f1a] border border-gray-700 rounded-lg p-3 text-white font-mono text-sm h-32 focus:border-cyan-500 focus:outline-none"
                  value={triggerPayload}
                  onChange={e => setTriggerPayload(e.target.value)}
                  spellCheck={false}
                />
                <div className="flex justify-end gap-2 mt-4">
                  <button onClick={() => setTriggerModal(null)} className="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Cancel</button>
                  <button onClick={() => triggerWorkflow(triggerModal.id)} className="px-4 py-2 text-sm bg-cyan-500 text-[#0f0f1a] rounded-lg font-medium hover:bg-cyan-400 transition">Execute</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Sub-Agents Page ────────────────────────────────
    function SubAgentsPage() {
      const [agents, setAgents] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        try {
          const res = await fetch('/api/subagents');
          const data = await res.json();
          setAgents(data);
        } catch { setAgents([]); }
        setLoading(false);
      }, []);

      useEffect(() => { load(); const iv = setInterval(load, 5000); return () => clearInterval(iv); }, [load]);

      const deleteAgent = async (id) => {
        await fetch(`/api/subagents/${id}`, { method: 'DELETE' });
        load();
      };

      const statusColor = { running: 'text-yellow-400', completed: 'text-green-400', failed: 'text-red-400', aborted: 'text-gray-400' };

      if (loading) return <div className="text-gray-500 text-center py-12">Cargando sub-agentes...</div>;

      return (
        <div className="space-y-4 fade-in">
          <div className="flex items-center justify-between">
            <p className="text-gray-400 text-sm">{agents.length} sub-agentes registrados (spawn via tool spawn_agent)</p>
            <button onClick={load} className="px-3 py-1 bg-card border border-border rounded text-sm hover:border-accent">Refrescar</button>
          </div>

          {agents.length === 0 ? (
            <Card><p className="text-gray-500 text-center py-8">No hay sub-agentes. Usa el tool spawn_agent para crear uno.</p></Card>
          ) : (
            <div className="space-y-3">
              {agents.map(a => (
                <Card key={a.id}>
                  <div className="flex items-start justify-between">
                    <div className="flex-1">
                      <div className="flex items-center gap-3 mb-1">
                        <span className={`font-medium ${statusColor[a.status] || 'text-gray-400'}`}>{a.status.toUpperCase()}</span>
                        <span className="text-gray-500 text-xs mono">{a.id.substring(0, 12)}...</span>
                        {a.execution_ms && <span className="text-gray-500 text-xs">{a.execution_ms}ms</span>}
                      </div>
                      <p className="text-white text-sm mb-1">{a.task}</p>
                      <div className="text-gray-500 text-xs">
                        Inicio: {new Date(a.started_at).toLocaleString()}
                        {a.completed_at && <span> | Fin: {new Date(a.completed_at).toLocaleString()}</span>}
                      </div>
                      {a.tools_used && a.tools_used !== '[]' && (
                        <div className="text-gray-500 text-xs mt-1">Tools: {JSON.parse(a.tools_used).join(', ')}</div>
                      )}
                      {a.result && a.status !== 'running' && (
                        <details className="mt-2">
                          <summary className="text-accent text-xs cursor-pointer">Ver resultado</summary>
                          <pre className="mt-1 p-2 bg-bg rounded text-xs text-gray-300 overflow-auto max-h-40 mono">{a.result.substring(0, 2000)}</pre>
                        </details>
                      )}
                    </div>
                    {a.status !== 'running' && (
                      <button onClick={() => deleteAgent(a.id)} className="text-red-400 hover:text-red-300 text-xs ml-3">Eliminar</button>
                    )}
                  </div>
                </Card>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── DM Pairing Page ─────────────────────────────────
    function PairingPage() {
      const [pending, setPending] = useState([]);
      const [allowed, setAllowed] = useState([]);
      const [loading, setLoading] = useState(true);
      const [newChannel, setNewChannel] = useState('telegram');
      const [newSenderId, setNewSenderId] = useState('');
      const [newName, setNewName] = useState('');

      const load = useCallback(async () => {
        try {
          const [pRes, aRes] = await Promise.all([
            fetch('/api/pairing/requests'),
            fetch('/api/pairing/allowed'),
          ]);
          setPending(await pRes.json());
          setAllowed(await aRes.json());
        } catch {}
        setLoading(false);
      }, []);

      useEffect(() => { load(); }, [load]);

      const allowSender = async () => {
        if (!newSenderId) return;
        await fetch('/api/pairing/allow', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channel: newChannel, senderId: newSenderId, displayName: newName }),
        });
        setNewSenderId('');
        setNewName('');
        load();
      };

      const revoke = async (id) => {
        await fetch(`/api/pairing/allowed/${id}`, { method: 'DELETE' });
        load();
      };

      if (loading) return <div className="text-gray-500 text-center py-12">Cargando...</div>;

      return (
        <div className="space-y-6 fade-in">
          {/* Pending Requests */}
          <Card>
            <h3 className="text-white font-medium mb-3">Solicitudes Pendientes ({pending.length})</h3>
            {pending.length === 0 ? (
              <p className="text-gray-500 text-sm">No hay solicitudes pendientes.</p>
            ) : (
              <div className="space-y-2">
                {pending.map(p => (
                  <div key={p.id} className="flex items-center justify-between p-2 bg-bg rounded">
                    <div>
                      <span className="text-accent mono text-sm">{p.code}</span>
                      <span className="text-gray-400 text-sm ml-3">{p.channel}/{p.sender_id}</span>
                      {p.sender_name && <span className="text-gray-500 text-sm ml-2">({p.sender_name})</span>}
                    </div>
                    <span className="text-gray-500 text-xs">Expira: {new Date(p.expires_at).toLocaleString()}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>

          {/* Allowed Senders */}
          <Card>
            <h3 className="text-white font-medium mb-3">Remitentes Permitidos ({allowed.length})</h3>
            {allowed.length === 0 ? (
              <p className="text-gray-500 text-sm">No hay remitentes permitidos.</p>
            ) : (
              <div className="space-y-2">
                {allowed.map(a => (
                  <div key={a.id} className="flex items-center justify-between p-2 bg-bg rounded">
                    <div>
                      <span className="text-white text-sm">{a.display_name || a.sender_id}</span>
                      <span className="text-gray-500 text-xs ml-3">{a.channel}/{a.sender_id}</span>
                      <span className="text-gray-600 text-xs ml-2">via {a.approved_via}</span>
                    </div>
                    <button onClick={() => revoke(a.id)} className="text-red-400 hover:text-red-300 text-xs">Revocar</button>
                  </div>
                ))}
              </div>
            )}
          </Card>

          {/* Add Sender */}
          <Card>
            <h3 className="text-white font-medium mb-3">Agregar Remitente</h3>
            <div className="flex gap-2 items-end flex-wrap">
              <div>
                <label className="text-gray-400 text-xs">Canal</label>
                <select value={newChannel} onChange={e => setNewChannel(e.target.value)}
                  className="block mt-1 bg-bg border border-border rounded px-2 py-1 text-sm text-white">
                  <option value="telegram">Telegram</option>
                  <option value="whatsapp">WhatsApp</option>
                  <option value="discord">Discord</option>
                  <option value="slack">Slack</option>
                </select>
              </div>
              <div className="flex-1 min-w-[150px]">
                <label className="text-gray-400 text-xs">Sender ID</label>
                <input value={newSenderId} onChange={e => setNewSenderId(e.target.value)} placeholder="ID del remitente"
                  className="block mt-1 w-full bg-bg border border-border rounded px-2 py-1 text-sm text-white" />
              </div>
              <div className="flex-1 min-w-[120px]">
                <label className="text-gray-400 text-xs">Nombre</label>
                <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Nombre (opcional)"
                  className="block mt-1 w-full bg-bg border border-border rounded px-2 py-1 text-sm text-white" />
              </div>
              <button onClick={allowSender}
                className="px-3 py-1 bg-accent text-bg rounded text-sm font-medium hover:bg-accent-dim">Permitir</button>
            </div>
          </Card>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  COSTS PAGE — Token Usage & API Costs
    // ═══════════════════════════════════════════════════════════════
    function CostsPage() {
      const [summary, setSummary] = useState(null);
      const [today, setToday] = useState(null);
      const [days, setDays] = useState(30);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const [sRes, tRes] = await Promise.all([api(`/costs?days=${days}`), api('/costs/today')]);
          setSummary(sRes);
          setToday(tRes);
        } catch {}
        setLoading(false);
      }, [days]);

      useEffect(() => { load(); }, [load]);

      if (loading) return <Spinner />;

      return (
        <div className="fade-in space-y-6">
          {/* Today Summary */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatCard label="Costo Hoy" value={`$${(today?.costUsd ?? 0).toFixed(4)}`} icon="$" />
            <StatCard label="Llamadas Hoy" value={today?.calls ?? 0} />
            <StatCard label="Tokens Input Hoy" value={(today?.inputTokens ?? 0).toLocaleString()} />
            <StatCard label="Tokens Output Hoy" value={(today?.outputTokens ?? 0).toLocaleString()} />
          </div>

          {/* Period selector */}
          <div className="flex items-center gap-3">
            <span className="text-gray-400 text-sm">Período:</span>
            {[7, 30, 90].map(d => (
              <button key={d} onClick={() => setDays(d)}
                className={`px-3 py-1 rounded text-xs ${days === d ? 'bg-accent text-black' : 'bg-surface text-gray-400 hover:text-white'}`}>
                {d}d
              </button>
            ))}
          </div>

          {summary && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              {/* By Provider */}
              <Card>
                <h3 className="text-sm font-semibold text-white mb-3">Costo por Proveedor ({days}d)</h3>
                <p className="text-2xl font-bold text-accent mb-4">${(summary.totalCostUsd ?? 0).toFixed(4)} USD</p>
                <div className="space-y-2">
                  {(summary.byProvider || []).map(p => (
                    <div key={p.provider} className="flex items-center justify-between text-sm">
                      <div className="flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-accent" />
                        <span className="text-gray-300 capitalize">{p.provider}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-white mono">${Number(p.costUsd).toFixed(4)}</span>
                        <span className="text-gray-500 ml-2 text-xs">{p.calls} calls</span>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-3 pt-3 border-t border-border text-xs text-gray-500">
                  Total: {(summary.totalInputTokens ?? 0).toLocaleString()} input + {(summary.totalOutputTokens ?? 0).toLocaleString()} output tokens
                </div>
              </Card>

              {/* By Channel */}
              <Card>
                <h3 className="text-sm font-semibold text-white mb-3">Costo por Canal ({days}d)</h3>
                <div className="space-y-2">
                  {(summary.byChannel || []).map(c => (
                    <div key={c.channel} className="flex items-center justify-between text-sm">
                      <span className="text-gray-300 capitalize">{c.channel}</span>
                      <div>
                        <span className="text-white mono">${Number(c.costUsd).toFixed(4)}</span>
                        <span className="text-gray-500 ml-2 text-xs">{c.calls} calls</span>
                      </div>
                    </div>
                  ))}
                  {(summary.byChannel || []).length === 0 && <p className="text-gray-500 text-xs">Sin datos</p>}
                </div>
              </Card>

              {/* Daily Trend */}
              <Card className="lg:col-span-2">
                <h3 className="text-sm font-semibold text-white mb-3">Costo Diario</h3>
                <div className="max-h-64 overflow-y-auto">
                  <table className="w-full text-xs">
                    <thead><tr className="text-gray-500 border-b border-border">
                      <th className="text-left py-2 font-medium">Fecha</th>
                      <th className="text-right py-2 font-medium">Costo</th>
                      <th className="text-right py-2 font-medium">Llamadas</th>
                    </tr></thead>
                    <tbody>
                      {(summary.byDay || []).map(d => (
                        <tr key={d.date} className="border-b border-border/50 hover:bg-surface">
                          <td className="py-1.5 text-gray-300">{d.date}</td>
                          <td className="py-1.5 text-right text-white mono">${Number(d.costUsd).toFixed(4)}</td>
                          <td className="py-1.5 text-right text-gray-400">{d.calls}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  INTEGRATIONS PAGE — REST API, Database, n8n
    // ═══════════════════════════════════════════════════════════════
    function IntegrationsPage() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showAdd, setShowAdd] = useState(false);
      const [editId, setEditId] = useState(null);
      const [form, setForm] = useState({ type: 'rest_api', name: '', url: '', token: '', apiKey: '', webhookBaseUrl: '' });
      const [actionLoading, setActionLoading] = useState({});
      const [testResults, setTestResults] = useState({});

      const load = useCallback(() => {
        api('/integrations').then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
      }, []);

      useEffect(() => { load(); const iv = setInterval(load, 10000); return () => clearInterval(iv); }, [load]);

      const doAction = async (id, action, method = 'POST') => {
        setActionLoading(p => ({ ...p, [id + action]: true }));
        try {
          const result = await api(`/integrations/${id}/${action}`, { method });
          if (action === 'test') setTestResults(p => ({ ...p, [id]: result }));
          load();
        } catch (err) { alert(err.message); }
        setActionLoading(p => ({ ...p, [id + action]: false }));
      };

      const handleSubmit = async () => {
        if (!form.name || !form.type) return alert('Nombre y tipo son requeridos');
        setActionLoading(p => ({ ...p, submit: true }));
        try {
          let cfg = {};
          if (form.type === 'rest_api') {
            if (!form.url) return alert('URL es requerida');
            cfg = { url: form.url, token: form.token || undefined, headers: {} };
          } else if (form.type === 'database') {
            if (!form.url) return alert('URL de conexion es requerida');
            cfg = { url: form.url };
          } else if (form.type === 'n8n') {
            if (!form.url || !form.apiKey) return alert('URL y API Key son requeridos');
            cfg = { url: form.url, apiKey: form.apiKey, webhookBaseUrl: form.webhookBaseUrl || undefined };
          }

          if (editId) {
            await api(`/integrations/${editId}`, { method: 'PUT', body: JSON.stringify({ name: form.name, config: cfg }) });
          } else {
            await api('/integrations', { method: 'POST', body: JSON.stringify({ type: form.type, name: form.name, config: cfg }) });
          }
          resetForm();
          load();
        } catch (err) { alert(err.message); }
        setActionLoading(p => ({ ...p, submit: false }));
      };

      const handleDelete = async (id, name) => {
        if (!confirm(`Eliminar integracion "${name}"?`)) return;
        setActionLoading(p => ({ ...p, [id + 'delete']: true }));
        try {
          await api(`/integrations/${id}`, { method: 'DELETE' });
          load();
        } catch (err) { alert(err.message); }
        setActionLoading(p => ({ ...p, [id + 'delete']: false }));
      };

      const startEdit = (row) => {
        const cfg = row.parsedConfig || {};
        setForm({
          type: row.type,
          name: row.name,
          url: cfg.url || '',
          token: '', // don't reveal
          apiKey: '', // don't reveal
          webhookBaseUrl: cfg.webhookBaseUrl || '',
        });
        setEditId(row.id);
        setShowAdd(true);
      };

      const resetForm = () => {
        setShowAdd(false);
        setEditId(null);
        setForm({ type: 'rest_api', name: '', url: '', token: '', apiKey: '', webhookBaseUrl: '' });
      };

      if (loading) return <Spinner />;

      const statusColor = { connected: 'bg-green-400', error: 'bg-red-400', disconnected: 'bg-gray-500' };
      const statusLabel = { connected: 'Conectado', error: 'Error', disconnected: 'Desconectado' };
      const typeLabel = { rest_api: 'REST API', database: 'Base de Datos', n8n: 'n8n' };
      const typeColor = { rest_api: 'text-blue-400', database: 'text-amber-400', n8n: 'text-green-400' };

      const byType = { rest_api: data.filter(d => d.type === 'rest_api'), database: data.filter(d => d.type === 'database'), n8n: data.filter(d => d.type === 'n8n') };

      return (
        <div className="fade-in space-y-6">
          {/* Stats */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Card>
              <p className="text-xs text-gray-500">REST APIs</p>
              <p className="text-lg font-bold text-blue-400">{byType.rest_api.length}</p>
              <p className="text-xs text-gray-600">{byType.rest_api.filter(d => d.status === 'connected').length} conectadas</p>
            </Card>
            <Card>
              <p className="text-xs text-gray-500">Bases de Datos</p>
              <p className="text-lg font-bold text-amber-400">{byType.database.length}</p>
              <p className="text-xs text-gray-600">{byType.database.filter(d => d.status === 'connected').length} conectadas</p>
            </Card>
            <Card>
              <p className="text-xs text-gray-500">n8n</p>
              <p className="text-lg font-bold text-green-400">{byType.n8n.length}</p>
              <p className="text-xs text-gray-600">{byType.n8n.filter(d => d.status === 'connected').length} conectadas</p>
            </Card>
            <Card>
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-xs text-gray-500">Total</p>
                  <p className="text-lg font-bold text-white">{data.length}</p>
                </div>
                <button onClick={() => { setEditId(null); setForm({ type: 'rest_api', name: '', url: '', token: '', apiKey: '', webhookBaseUrl: '' }); setShowAdd(true); }}
                  className="w-9 h-9 rounded-lg bg-accent/20 text-accent flex items-center justify-center hover:bg-accent/30 transition-colors text-lg font-bold">+</button>
              </div>
            </Card>
          </div>

          {/* Add/Edit form */}
          {showAdd && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">{editId ? 'Editar Integracion' : 'Nueva Integracion'}</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-gray-500 block mb-1">Tipo</label>
                  <select value={form.type} onChange={e => setForm(p => ({ ...p, type: e.target.value }))} disabled={!!editId}
                    className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white focus:border-accent outline-none">
                    <option value="rest_api">REST API</option>
                    <option value="database">Base de Datos (MySQL)</option>
                    <option value="n8n">n8n</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-gray-500 block mb-1">Nombre (identificador)</label>
                  <input value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} disabled={!!editId}
                    placeholder="myapp, produccion, etc." className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none mono" />
                </div>
                <div className="sm:col-span-2">
                  <label className="text-xs text-gray-500 block mb-1">
                    {form.type === 'database' ? 'URL de Conexion (mysql://user:pass@host:port/db)' : 'URL base'}
                  </label>
                  <input value={form.url} onChange={e => setForm(p => ({ ...p, url: e.target.value }))}
                    placeholder={form.type === 'database' ? 'mysql://user:password@localhost:3306/mydb' : 'https://api.example.com'}
                    className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none mono" />
                </div>
                {form.type === 'rest_api' && (
                  <div className="sm:col-span-2">
                    <label className="text-xs text-gray-500 block mb-1">Bearer Token (opcional)</label>
                    <input value={form.token} onChange={e => setForm(p => ({ ...p, token: e.target.value }))} type="password"
                      placeholder="Token de autenticacion..." className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none" />
                  </div>
                )}
                {form.type === 'n8n' && (
                  <>
                    <div>
                      <label className="text-xs text-gray-500 block mb-1">API Key</label>
                      <input value={form.apiKey} onChange={e => setForm(p => ({ ...p, apiKey: e.target.value }))} type="password"
                        placeholder="n8n API key..." className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none" />
                    </div>
                    <div>
                      <label className="text-xs text-gray-500 block mb-1">Webhook Base URL (opcional)</label>
                      <input value={form.webhookBaseUrl} onChange={e => setForm(p => ({ ...p, webhookBaseUrl: e.target.value }))}
                        placeholder="https://n8n.mydomain.com" className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none mono" />
                    </div>
                  </>
                )}
              </div>
              <div className="flex gap-2 mt-4">
                <Button onClick={handleSubmit} disabled={actionLoading.submit}>
                  {actionLoading.submit ? 'Guardando...' : (editId ? 'Guardar' : 'Crear')}
                </Button>
                <Button variant="ghost" onClick={resetForm}>Cancelar</Button>
              </div>
            </Card>
          )}

          {/* Integrations list */}
          {data.length > 0 ? (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">Integraciones Configuradas</h3>
              <div className="space-y-3">
                {data.map(row => (
                  <div key={row.id} className={`p-4 rounded-lg border transition-colors ${row.status === 'connected' ? 'bg-emerald-900/5 border-emerald-700/30' : row.status === 'error' ? 'bg-red-900/5 border-red-700/30' : 'bg-surface border-border'}`}>
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-3">
                        <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${statusColor[row.status] || 'bg-gray-500'}`} />
                        <div>
                          <span className="text-sm font-semibold text-white">{row.name}</span>
                          <span className={`text-xs ml-2 ${typeColor[row.type]}`}>{typeLabel[row.type]}</span>
                          <span className="text-xs text-gray-500 ml-2">{statusLabel[row.status] || row.status}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => doAction(row.id, 'test')} disabled={actionLoading[row.id + 'test']}
                          className="px-2 py-1 text-xs bg-surface rounded hover:bg-bg text-gray-400 hover:text-white transition-colors">
                          {actionLoading[row.id + 'test'] ? '...' : 'Test'}
                        </button>
                        {row.status === 'connected' ? (
                          <button onClick={() => doAction(row.id, 'disconnect')} disabled={actionLoading[row.id + 'disconnect']}
                            className="px-2 py-1 text-xs bg-red-900/30 rounded hover:bg-red-900/50 text-red-400 transition-colors">
                            {actionLoading[row.id + 'disconnect'] ? '...' : 'Desconectar'}
                          </button>
                        ) : (
                          <button onClick={() => doAction(row.id, 'connect')} disabled={actionLoading[row.id + 'connect']}
                            className="px-2 py-1 text-xs bg-accent/20 rounded hover:bg-accent/30 text-accent transition-colors">
                            {actionLoading[row.id + 'connect'] ? '...' : 'Conectar'}
                          </button>
                        )}
                        <button onClick={() => doAction(row.id, 'toggle')} disabled={actionLoading[row.id + 'toggle']}
                          className={`px-2 py-1 text-xs rounded transition-colors ${row.enabled ? 'bg-surface hover:bg-bg text-gray-400 hover:text-yellow-400' : 'bg-yellow-900/30 hover:bg-yellow-900/50 text-yellow-400'}`}>
                          {row.enabled ? 'Deshabilitar' : 'Habilitar'}
                        </button>
                        <button onClick={() => startEdit(row)}
                          className="px-2 py-1 text-xs bg-surface rounded hover:bg-bg text-gray-400 hover:text-white transition-colors">Editar</button>
                        <button onClick={() => handleDelete(row.id, row.name)}
                          className="px-2 py-1 text-xs bg-surface rounded hover:bg-red-900/30 text-gray-400 hover:text-red-400 transition-colors">Eliminar</button>
                      </div>
                    </div>
                    <div className="flex items-center gap-4 text-xs text-gray-500">
                      <span className="mono truncate max-w-[300px]" title={row.parsedConfig?.url}>{row.parsedConfig?.url}</span>
                      {row.tool_name && <span className="text-accent mono">{row.tool_name}</span>}
                      {!row.enabled && <span className="text-yellow-500">deshabilitada</span>}
                    </div>
                    {row.last_error && row.status === 'error' && (
                      <p className="text-xs text-red-400/70 mt-2 truncate" title={row.last_error}>{row.last_error}</p>
                    )}
                    {testResults[row.id] && (
                      <p className={`text-xs mt-2 ${testResults[row.id].ok ? 'text-green-400' : 'text-red-400'}`}>
                        Test: {testResults[row.id].ok ? 'OK' : 'FALLO'} — {testResults[row.id].detail}
                      </p>
                    )}
                  </div>
                ))}
              </div>
            </Card>
          ) : !showAdd && (
            <Card>
              <div className="text-center py-8">
                <p className="text-gray-400 mb-3">No hay integraciones configuradas</p>
                <p className="text-xs text-gray-600 mb-4">Agrega REST APIs, Bases de Datos MySQL, o conexiones n8n para que ATLAS pueda acceder a tus sistemas.</p>
                <Button onClick={() => setShowAdd(true)}>Agregar Integracion</Button>
              </div>
            </Card>
          )}

          {/* Info */}
          <Card>
            <h3 className="text-sm font-semibold text-white mb-2">Como funcionan las integraciones</h3>
            <div className="text-xs text-gray-500 space-y-1">
              <p><span className="text-blue-400">REST API:</span> Se registra como tool <code className="text-gray-400">api_nombre</code>. ATLAS puede hacer GET/POST/PUT/DELETE.</p>
              <p><span className="text-amber-400">Base de Datos:</span> Se registra como tool <code className="text-gray-400">db_nombre</code>. Solo SELECT (lectura). Soporta MySQL.</p>
              <p><span className="text-green-400">n8n:</span> Se registra como tool <code className="text-gray-400">n8n</code>. Listar, activar, ejecutar workflows.</p>
              <p className="text-gray-600 mt-2">Las integraciones creadas desde .env (LARAVEL_API_URL, DATABASE_URL, N8N_*) se migran automaticamente como "default".</p>
            </div>
          </Card>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  MCP PAGE — Model Context Protocol
    // ═══════════════════════════════════════════════════════════════
    function McpPage() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [showAdd, setShowAdd] = useState(false);
      const [form, setForm] = useState({ name: '', url: '', apiKey: '', autoConnect: true });
      const [actionLoading, setActionLoading] = useState({});
      const [editId, setEditId] = useState(null);

      const load = useCallback(() => {
        api('/mcp').then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
      }, []);

      useEffect(() => { load(); const iv = setInterval(load, 10000); return () => clearInterval(iv); }, [load]);

      const doAction = async (id, action, method = 'POST') => {
        setActionLoading(p => ({ ...p, [id + action]: true }));
        try {
          await api(`/mcp/servers/${id}/${action}`, { method });
          load();
        } catch (err) { alert(err.message); }
        setActionLoading(p => ({ ...p, [id + action]: false }));
      };

      const handleAdd = async () => {
        if (!form.name || !form.url) return alert('Nombre y URL son requeridos');
        setActionLoading(p => ({ ...p, add: true }));
        try {
          if (editId) {
            await api(`/mcp/servers/${editId}`, { method: 'PUT', body: JSON.stringify(form) });
          } else {
            await api('/mcp/servers', { method: 'POST', body: JSON.stringify(form) });
          }
          setShowAdd(false); setForm({ name: '', url: '', apiKey: '', autoConnect: true }); setEditId(null);
          load();
        } catch (err) { alert(err.message); }
        setActionLoading(p => ({ ...p, add: false }));
      };

      const handleDelete = async (id, name) => {
        if (!confirm(`Eliminar servidor "${name}"?`)) return;
        await doAction(id, '', 'DELETE');
      };

      const startEdit = (srv) => {
        setForm({ name: srv.name, url: srv.url, apiKey: '', autoConnect: !!srv.auto_connect });
        setEditId(srv.id);
        setShowAdd(true);
      };

      if (loading) return <Spinner />;
      if (!data) return <EmptyState message="MCP no disponible" />;

      const statusColor = { connected: 'bg-green-400', error: 'bg-red-400', disconnected: 'bg-gray-500', disabled: 'bg-gray-700' };
      const statusLabel = { connected: 'Conectado', error: 'Error', disconnected: 'Desconectado', disabled: 'Deshabilitado' };

      return (
        <div className="fade-in space-y-6">
          {/* Stats row */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Card>
              <p className="text-xs text-gray-500">MCP Server</p>
              <p className={`text-lg font-bold ${data.server?.enabled ? 'text-green-400' : 'text-gray-500'}`}>
                {data.server?.enabled ? `Puerto ${data.server.port}` : 'Inactivo'}
              </p>
              <p className="text-xs text-gray-600">{data.server?.toolsExposed || 0} tools expuestos</p>
            </Card>
            <Card>
              <p className="text-xs text-gray-500">Servidores</p>
              <p className="text-lg font-bold text-white">{data.servers?.length || 0}</p>
              <p className="text-xs text-gray-600">{data.client?.connectedCount || 0} conectados</p>
            </Card>
            <Card>
              <p className="text-xs text-gray-500">Tools Importados</p>
              <p className="text-lg font-bold text-accent">{data.client?.importedTools || 0}</p>
              <p className="text-xs text-gray-600">desde servidores externos</p>
            </Card>
            <Card>
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-xs text-gray-500">Gestionar</p>
                  <p className="text-sm text-gray-400 mt-1">Agregar servidor</p>
                </div>
                <button onClick={() => { setEditId(null); setForm({ name: '', url: '', apiKey: '', autoConnect: true }); setShowAdd(true); }}
                  className="w-9 h-9 rounded-lg bg-accent/20 text-accent flex items-center justify-center hover:bg-accent/30 transition-colors text-lg font-bold">+</button>
              </div>
            </Card>
          </div>

          {/* Add/Edit modal */}
          {showAdd && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">{editId ? 'Editar Servidor MCP' : 'Agregar Servidor MCP'}</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-gray-500 block mb-1">Nombre (identificador)</label>
                  <input value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} disabled={!!editId}
                    placeholder="mi-servidor" className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none mono" />
                </div>
                <div>
                  <label className="text-xs text-gray-500 block mb-1">URL del servidor MCP</label>
                  <input value={form.url} onChange={e => setForm(p => ({ ...p, url: e.target.value }))}
                    placeholder="http://localhost:5051/mcp" className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none mono" />
                </div>
                <div>
                  <label className="text-xs text-gray-500 block mb-1">API Key (opcional)</label>
                  <input value={form.apiKey} onChange={e => setForm(p => ({ ...p, apiKey: e.target.value }))} type="password"
                    placeholder="Bearer token..." className="w-full bg-surface border border-border rounded px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-accent outline-none" />
                </div>
                <div className="flex items-end gap-3">
                  <label className="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
                    <input type="checkbox" checked={form.autoConnect} onChange={e => setForm(p => ({ ...p, autoConnect: e.target.checked }))}
                      className="rounded bg-surface border-border" />
                    Auto-conectar al iniciar
                  </label>
                </div>
              </div>
              <div className="flex gap-2 mt-4">
                <Button onClick={handleAdd} disabled={actionLoading.add}>
                  {actionLoading.add ? 'Guardando...' : (editId ? 'Guardar' : 'Agregar')}
                </Button>
                <Button variant="ghost" onClick={() => { setShowAdd(false); setEditId(null); }}>Cancelar</Button>
              </div>
            </Card>
          )}

          {/* Servers list */}
          {data.servers?.length > 0 ? (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">Servidores MCP Configurados</h3>
              <div className="space-y-3">
                {data.servers.map(srv => (
                  <div key={srv.id} className={`p-4 rounded-lg border transition-colors ${srv.status === 'connected' ? 'bg-emerald-900/5 border-emerald-700/30' : 'bg-surface border-border'}`}>
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-3">
                        <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${statusColor[srv.status] || 'bg-gray-500'}`} />
                        <div>
                          <span className="text-sm font-semibold text-white">{srv.name}</span>
                          <span className="text-xs text-gray-500 ml-2">{statusLabel[srv.status] || srv.status}</span>
                        </div>
                      </div>
                      <div className="flex items-center gap-1.5">
                        {srv.status === 'connected' ? (
                          <>
                            <button onClick={() => doAction(srv.id, 'refresh')} disabled={actionLoading[srv.id + 'refresh']}
                              className="px-2 py-1 text-xs bg-surface rounded hover:bg-bg text-gray-400 hover:text-white transition-colors"
                              title="Refrescar tools">
                              {actionLoading[srv.id + 'refresh'] ? '...' : 'Refresh'}
                            </button>
                            <button onClick={() => doAction(srv.id, 'disconnect')} disabled={actionLoading[srv.id + 'disconnect']}
                              className="px-2 py-1 text-xs bg-red-900/30 rounded hover:bg-red-900/50 text-red-400 transition-colors">
                              {actionLoading[srv.id + 'disconnect'] ? '...' : 'Desconectar'}
                            </button>
                          </>
                        ) : (
                          <button onClick={() => doAction(srv.id, 'connect')} disabled={actionLoading[srv.id + 'connect']}
                            className="px-2 py-1 text-xs bg-accent/20 rounded hover:bg-accent/30 text-accent transition-colors">
                            {actionLoading[srv.id + 'connect'] ? 'Conectando...' : 'Conectar'}
                          </button>
                        )}
                        <button onClick={() => startEdit(srv)}
                          className="px-2 py-1 text-xs bg-surface rounded hover:bg-bg text-gray-400 hover:text-white transition-colors">Editar</button>
                        <button onClick={() => handleDelete(srv.id, srv.name)}
                          className="px-2 py-1 text-xs bg-surface rounded hover:bg-red-900/30 text-gray-400 hover:text-red-400 transition-colors">Eliminar</button>
                      </div>
                    </div>
                    <div className="flex items-center gap-4 text-xs text-gray-500">
                      <span className="mono truncate max-w-[300px]" title={srv.url}>{srv.url}</span>
                      {srv.tools_count > 0 && <span className="text-accent">{srv.tools_count} tools</span>}
                      {srv.auto_connect ? <span className="text-gray-600">auto-connect</span> : null}
                      {srv.api_key && <span className="text-gray-600">con API key</span>}
                    </div>
                    {srv.last_error && srv.status === 'error' && (
                      <p className="text-xs text-red-400/70 mt-2 truncate" title={srv.last_error}>{srv.last_error}</p>
                    )}
                    {srv.importedTools?.length > 0 && (
                      <div className="flex flex-wrap gap-1 mt-2">
                        {srv.importedTools.map(t => (
                          <span key={t} className="px-1.5 py-0.5 bg-bg rounded text-[10px] text-cyan-400 mono">{t}</span>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </Card>
          ) : !showAdd && (
            <Card>
              <div className="text-center py-8">
                <p className="text-gray-400 mb-3">No hay servidores MCP configurados</p>
                <p className="text-xs text-gray-600 mb-4">Conecta servidores MCP externos para importar sus herramientas a ATLAS</p>
                <Button onClick={() => setShowAdd(true)}>Agregar Servidor</Button>
              </div>
            </Card>
          )}

          {/* All imported tools */}
          {data.client?.tools?.length > 0 && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-3">Todos los Tools MCP Importados</h3>
              <div className="flex flex-wrap gap-1.5">
                {data.client.tools.map(t => (
                  <span key={t} className="px-2 py-0.5 bg-surface rounded text-xs text-cyan-300 mono">{t}</span>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  FEEDBACK PAGE — User Feedback
    // ═══════════════════════════════════════════════════════════════
    function FeedbackPage() {
      const [stats, setStats] = useState(null);
      const [recent, setRecent] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        api('/feedback').then(d => {
          setStats(d.stats);
          setRecent(d.recent || []);
        }).catch(() => {}).finally(() => setLoading(false));
      }, []);

      if (loading) return <Spinner />;

      const satisfaction = stats && stats.total > 0
        ? Math.round((stats.positive / stats.total) * 100) : null;

      return (
        <div className="fade-in space-y-6">
          {/* Stats */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <StatCard label="Total Feedback" value={stats?.total ?? 0} />
            <StatCard label="Positivos" value={stats?.positive ?? 0} sub={satisfaction !== null ? `${satisfaction}% satisfacción` : ''} />
            <StatCard label="Negativos" value={stats?.negative ?? 0} />
            <StatCard label="Neutrales" value={(stats?.total ?? 0) - (stats?.positive ?? 0) - (stats?.negative ?? 0)} />
          </div>

          {/* Satisfaction Meter */}
          {satisfaction !== null && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-3">Satisfacción General</h3>
              <Meter label="Satisfacción" value={satisfaction} max={100} unit="%" />
            </Card>
          )}

          {/* Recent Feedback */}
          <Card>
            <h3 className="text-sm font-semibold text-white mb-3">Feedback Reciente</h3>
            {recent.length === 0 ? (
              <EmptyState message="Sin feedback registrado aún. Los usuarios pueden valorar las respuestas de ATLAS." />
            ) : (
              <div className="space-y-2 max-h-[500px] overflow-y-auto">
                {recent.map((f, i) => (
                  <div key={i} className="py-2.5 px-3 rounded bg-surface border-l-2"
                    style={{ borderLeftColor: f.rating > 0 ? '#4ade80' : f.rating < 0 ? '#ef4444' : '#6b7280' }}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs text-gray-500">{f.channel || 'N/A'} · {new Date(f.created_at).toLocaleString('es-CO')}</span>
                      <span className={`text-xs px-1.5 py-0.5 rounded ${f.rating > 0 ? 'bg-green-900/50 text-green-400' : f.rating < 0 ? 'bg-red-900/50 text-red-400' : 'bg-gray-700 text-gray-400'}`}>
                        {f.rating > 0 ? '+1' : f.rating < 0 ? '-1' : '0'}
                      </span>
                    </div>
                    {f.user_message && <p className="text-xs text-gray-400 truncate"><b>User:</b> {f.user_message}</p>}
                    {f.assistant_response && <p className="text-xs text-gray-400 truncate mt-0.5"><b>ATLAS:</b> {f.assistant_response}</p>}
                    {f.comment && <p className="text-xs text-cyan-300 mt-1">"{f.comment}"</p>}
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  LIVE CONVERSATIONS PAGE — Real-time streaming
    // ═══════════════════════════════════════════════════════════════
    function LivePage() {
      const [conversations, setConversations] = useState([]);
      const [activeConv, setActiveConv] = useState(null);
      const [streamContent, setStreamContent] = useState('');
      const streamRef = useRef('');

      const handleStart = useCallback((data) => {
        const conv = {
          id: data.sessionId + '_' + Date.now(),
          sessionId: data.sessionId,
          channel: data.channel,
          userMessage: data.userMessage,
          startedAt: new Date(),
          status: 'active',
          response: '',
        };
        setConversations(prev => [conv, ...prev].slice(0, 50));
        setActiveConv(conv.id);
        streamRef.current = '';
        setStreamContent('');
      }, []);

      const handleDelta = useCallback((data) => {
        if (data.text) {
          streamRef.current += data.text;
          setStreamContent(streamRef.current);
        }
      }, []);

      const handleEnd = useCallback((data) => {
        setConversations(prev => prev.map(c => {
          if (c.sessionId === data.sessionId && c.status === 'active') {
            return { ...c, status: 'completed', response: data.response || streamRef.current, tokensUsed: data.tokensUsed, toolsUsed: data.toolsUsed, duration: data.durationMs };
          }
          return c;
        }));
        setStreamContent('');
      }, []);

      useSocket('conversation_start', handleStart);
      useSocket('stream_delta', handleDelta);
      useSocket('conversation_end', handleEnd);

      const active = conversations.find(c => c.id === activeConv);

      return (
        <div className="fade-in space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4" style={{ minHeight: '70vh' }}>
            {/* Conversation List */}
            <Card className="lg:col-span-1">
              <h3 className="text-sm font-semibold text-white mb-3">Conversaciones <span className="text-xs text-gray-500 font-normal">tiempo real</span></h3>
              <div className="space-y-1.5 max-h-[60vh] overflow-y-auto">
                {conversations.length === 0 && <p className="text-gray-500 text-xs py-4 text-center">Esperando conversaciones...</p>}
                {conversations.map(c => (
                  <button key={c.id} onClick={() => setActiveConv(c.id)}
                    className={`w-full text-left p-2.5 rounded text-xs transition-colors ${activeConv === c.id ? 'bg-accent/10 border border-accent/30' : 'bg-surface hover:bg-surface/80'}`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-gray-300 capitalize">{c.channel}</span>
                      <span className={`w-2 h-2 rounded-full ${c.status === 'active' ? 'bg-green-400 animate-pulse' : 'bg-gray-500'}`} />
                    </div>
                    <p className="text-gray-400 truncate">{c.userMessage}</p>
                    <p className="text-gray-600 mt-0.5">{c.startedAt.toLocaleTimeString('es-CO')}</p>
                  </button>
                ))}
              </div>
            </Card>

            {/* Conversation Detail */}
            <Card className="lg:col-span-2">
              {active ? (
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h3 className="text-sm font-semibold text-white">Canal: <span className="text-accent capitalize">{active.channel}</span></h3>
                      <p className="text-xs text-gray-500">{active.startedAt.toLocaleString('es-CO')}</p>
                    </div>
                    {active.status === 'active' && (
                      <span className="flex items-center gap-1.5 text-xs text-green-400">
                        <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse" /> Procesando...
                      </span>
                    )}
                    {active.status === 'completed' && active.duration && (
                      <span className="text-xs text-gray-500">{(active.duration / 1000).toFixed(1)}s</span>
                    )}
                  </div>

                  {/* User Message */}
                  <div className="mb-4 p-3 rounded-lg bg-surface border-l-2 border-blue-500">
                    <p className="text-xs text-gray-500 mb-1">Usuario</p>
                    <p className="text-sm text-white whitespace-pre-wrap">{active.userMessage}</p>
                  </div>

                  {/* Response / Stream */}
                  <div className="p-3 rounded-lg bg-surface border-l-2 border-accent">
                    <p className="text-xs text-gray-500 mb-1">ATLAS</p>
                    <p className="text-sm text-gray-200 whitespace-pre-wrap mono">
                      {active.status === 'active' ? (streamContent || '...') : (active.response || '(sin respuesta)')}
                    </p>
                  </div>

                  {/* Metadata */}
                  {active.status === 'completed' && (
                    <div className="mt-3 flex flex-wrap gap-2 text-xs text-gray-500">
                      {active.tokensUsed && <span>Tokens: {active.tokensUsed.input}↑ {active.tokensUsed.output}↓</span>}
                      {active.toolsUsed?.length > 0 && <span>Tools: {active.toolsUsed.join(', ')}</span>}
                    </div>
                  )}
                </div>
              ) : (
                <div className="h-full flex items-center justify-center">
                  <p className="text-gray-500 text-sm">Seleccioná una conversación o esperá una nueva</p>
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  APP ROOT
    // ═══════════════════════════════════════════════════════════════
    function App() {
      const [page, setPage] = useState('Overview');
      const [collapsed, setCollapsed] = useState(false);
      const [mobileNav, setMobileNav] = useState(false);

      const pageTitles = {
        Overview: 'Vista General del Sistema',
        Analytics: 'Analíticas de Conversación',
        Memory: 'Almacén de Memoria',
        Agents: 'Registro de Agentes',
        Skills: 'Biblioteca de Skills',
        Tasks: 'Tareas Programadas',
        Channels: 'Gestión de Canales',
        Pipelines: 'Pipelines de Automatización',
        Goals: 'Objetivos Autónomos',
        Knowledge: 'Grafo de Conocimiento',
        Plugins: 'Marketplace de Plugins',
        Users: 'Gestión de Usuarios',
        'A/B Tests': 'Pruebas A/B de Prompts',
        Behavior: 'Inteligencia Proactiva',
        'Domótica': 'Control Domótico',
        SubAgents: 'Sub-Agentes Autónomos',
        Pairing: 'Control de Acceso DM',
        Costs: 'Costos y Tokens API',
        MCP: 'Model Context Protocol',
        Integrations: 'Integraciones (REST API, DB, n8n)',
        Feedback: 'Feedback de Usuarios',
        Live: 'Conversaciones en Vivo',
        Prompt: 'Editor del System Prompt',
        Logs: 'Logs del Sistema',
        Config: 'Ajustes',
      };

      const renderPage = () => {
        switch (page) {
          case 'Overview': return <OverviewPage />;
          case 'Analytics': return <AnalyticsPage />;
          case 'Memory': return <MemoryPage />;
          case 'Agents': return <AgentsPage />;
          case 'Skills': return <SkillsPage />;
          case 'Tasks': return <TasksPage />;
          case 'Channels': return <ChannelsPage />;
          case 'Pipelines': return <PipelinesPage />;
          case 'Goals': return <GoalsPage />;
          case 'Knowledge': return <KnowledgePage />;
          case 'Plugins': return <PluginsPage />;
          case 'Users': return <UsersPage />;
          case 'A/B Tests': return <ABTestsPage />;
          case 'Behavior': return <BehaviorPage />;
          case 'Domótica': return <DomoticaPage />;
          case 'n8n': return <N8nPage />;
          case 'SubAgents': return <SubAgentsPage />;
          case 'Pairing': return <PairingPage />;
          case 'Costs': return <CostsPage />;
          case 'MCP': return <McpPage />;
          case 'Integrations': return <IntegrationsPage />;
          case 'Feedback': return <FeedbackPage />;
          case 'Live': return <LivePage />;
          case 'Prompt': return <PromptPage />;
          case 'Logs': return <LogsPage />;
          case 'Config': return <ConfigPage />;
          default: return <OverviewPage />;
        }
      };

      return (
        <div className="min-h-screen bg-bg">
          {/* Desktop Sidebar */}
          <div className="hidden lg:block">
            <Sidebar page={page} setPage={setPage} collapsed={collapsed} setCollapsed={setCollapsed} />
          </div>

          {/* Mobile Nav */}
          <MobileNav page={page} setPage={setPage} open={mobileNav} setOpen={setMobileNav} />

          {/* Main Content */}
          <div className={`transition-all duration-200 ${collapsed ? 'lg:ml-16' : 'lg:ml-56'}`}>
            {/* Header */}
            <header className="sticky top-0 z-20 bg-bg/80 backdrop-blur-md border-b border-border">
              <div className="flex items-center justify-between px-6 h-16">
                <div className="flex items-center gap-4">
                  <button className="lg:hidden text-gray-400 hover:text-white" onClick={() => setMobileNav(true)}>
                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                      <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                  </button>
                  <div>
                    <h1 className="text-white font-semibold text-lg">
                      <span className="text-accent">ATLAS</span> Dashboard
                    </h1>
                    <p className="text-gray-500 text-xs -mt-0.5">{pageTitles[page]}</p>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="hidden sm:inline text-xs text-gray-600 mono">{new Date().toLocaleDateString()}</span>
                </div>
              </div>
            </header>

            {/* Page Content */}
            <main className="p-6" key={page}>
              {renderPage()}
            </main>
          </div>
        </div>
      );
    }

    // ─── Mount ────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <SocketProvider>
        <App />
      </SocketProvider>
    );
  </script>
</body>
</html>
