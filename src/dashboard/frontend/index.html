                      </button>
                    );
                  })}
                </div>
              </Card>
            </div>

            {/* Settings form */}
            <div className="flex-1 min-w-0 space-y-4">

              {/* ── Generic Interactive Cards ── */}
              {currentCards.length > 0 && (
                <Card>
                  <div className="flex items-center justify-between mb-3">
                    <h4 className="text-xs uppercase tracking-wider text-gray-500">{currentCat?.label || ''}</h4>
                    <span className="text-[10px] text-gray-600">Click para configurar</span>
                  </div>
                  <div className={`grid gap-3 ${currentCards.length <= 3 ? 'grid-cols-1 sm:grid-cols-' + currentCards.length : currentCards.length <= 4 ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3'}`}>
                    {currentCards.map(card => (
                      <div key={card.group}
                           onClick={() => setProviderModal(card.group)}
                           className={`p-4 rounded-lg border cursor-pointer transition-all hover:border-accent/40 hover:shadow-lg hover:shadow-accent/5 ${card.active ? 'bg-emerald-900/5 border-emerald-700/30' : 'bg-surface border-border'}`}>
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2.5">
                            <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${card.active ? 'bg-emerald-900/30' : 'bg-bg'}`}>
                              <svg className={`w-5 h-5 ${card.active ? 'text-emerald-400' : 'text-gray-600'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                                <path strokeLinecap="round" strokeLinejoin="round" d={cardIcons[card.icon] || cardIcons.features} />
                              </svg>
                            </div>
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className={`text-sm font-semibold ${card.active ? 'text-white' : 'text-gray-400'}`}>{card.label}</span>
                                {card.badge && <span className="text-[10px] bg-accent/20 text-accent px-1.5 py-0.5 rounded-full font-medium">{card.badge}</span>}
                              </div>
                              <span className="text-[10px] text-gray-500">{card.sublabel}</span>
                            </div>
                          </div>
                          <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${card.active ? 'bg-emerald-400' : 'bg-gray-600'}`} />
                        </div>
                        <div className="flex items-center justify-between mt-1">
                          <span className={`text-xs truncate mr-2 mono ${card.active ? 'text-emerald-300/80' : 'text-gray-500'}`}>{card.status}</span>
                          <span className="text-xs text-accent/70 hover:text-accent shrink-0 font-medium">Configurar →</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </Card>
              )}

              {/* ── Settings form ── */}
              <Card>
                <h3 className="text-sm font-semibold text-white mb-4">{currentCat?.label || 'Ajustes'}</h3>

                {(cardGroupNames.length > 0 ? groups.filter(g => !cardGroupNames.includes(g.name)) : groups).map((group, gi) => (
                  <div key={gi} className="mb-5">
                    {group.name && (
                      <h4 className="text-xs uppercase tracking-wider text-gray-500 mb-3 pb-1 border-b border-border">{group.name}</h4>
                    )}
                    <div className="space-y-3">
                      {group.items.map(s => (
                        <SettingRow
                          key={s.key}
                          setting={s}
                          value={values[s.key] ?? ''}
                          isDirty={values[s.key] !== originalValues[s.key]}
                          showPw={showPw[s.key]}
                          onTogglePw={() => setShowPw(prev => ({ ...prev, [s.key]: !prev[s.key] }))}
                          onChange={val => setValues(prev => ({ ...prev, [s.key]: val }))}
                        />
                      ))}
                    </div>
                  </div>
                ))}
              </Card>

              {/* Save bar */}
              {dirtyKeys.length > 0 && (
                <div className="flex items-center gap-3 sticky bottom-4 bg-card/90 backdrop-blur-sm p-3 rounded-lg border border-accent/30">
                  <Button onClick={handleSave} disabled={saving}>
                    {saving ? 'Guardando...' : `Guardar ${dirtyKeys.length} cambio${dirtyKeys.length > 1 ? 's' : ''}`}
                  </Button>
                  <Button variant="ghost" onClick={() => setValues({ ...originalValues })}>
                    Cancelar
                  </Button>
                  <span className="text-xs text-gray-500">{dirtyKeys.length} campo{dirtyKeys.length > 1 ? 's' : ''} modificado{dirtyKeys.length > 1 ? 's' : ''}</span>
                </div>
              )}
            </div>
          </div>

          {/* ── Config Modal (Generic) ── */}
          {providerModal && (() => {
            const modalSettings = settings.filter(s => s.group === providerModal);
            const card = currentCards.find(c => c.group === providerModal);
            const modalDirtyKeys = dirtyKeys.filter(k => modalSettings.find(s => s.key === k));
            return (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={() => setProviderModal(null)}>
                <div className="bg-card border border-border rounded-xl w-full max-w-lg mx-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                  {/* Header */}
                  <div className="flex items-center justify-between p-5 pb-4">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-lg flex items-center justify-center ${card?.active ? 'bg-emerald-900/30' : 'bg-surface'}`}>
                        <svg className={`w-5 h-5 ${card?.active ? 'text-emerald-400' : 'text-gray-500'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                          <path strokeLinecap="round" strokeLinejoin="round" d={cardIcons[card?.icon] || cardIcons.features} />
                        </svg>
                      </div>
                      <div>
                        <h3 className="text-white font-semibold">{card?.label || providerModal}</h3>
                        <div className="flex items-center gap-1.5 mt-0.5">
                          <span className={`w-1.5 h-1.5 rounded-full ${card?.active ? 'bg-emerald-400' : 'bg-gray-600'}`} />
                          <span className={`text-xs ${card?.active ? 'text-emerald-400' : 'text-gray-500'}`}>
                            {card?.status || 'Sin configurar'}
                          </span>
                        </div>
                      </div>
                    </div>
                    <button onClick={() => setProviderModal(null)} className="text-gray-400 hover:text-white transition-colors p-1">
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>
                  </div>
                  {/* Settings */}
                  <div className="px-5 pb-2 space-y-4 max-h-[60vh] overflow-y-auto">
                    {modalSettings.length > 0 ? modalSettings.map(s => (
                      <SettingRow
                        key={s.key}
                        setting={s}
                        value={values[s.key] ?? ''}
                        isDirty={values[s.key] !== originalValues[s.key]}
                        showPw={showPw[s.key]}
                        onTogglePw={() => setShowPw(prev => ({ ...prev, [s.key]: !prev[s.key] }))}
                        onChange={val => setValues(prev => ({ ...prev, [s.key]: val }))}
                      />
                    )) : (
                      <p className="text-sm text-gray-500 py-4 text-center">No hay ajustes configurables para este modulo.</p>
                    )}
                  </div>
                  {/* Footer */}
                  <div className="flex items-center gap-2 p-5 pt-4 border-t border-border">
                    {modalDirtyKeys.length > 0 ? (
                      <>
                        <Button onClick={async () => { await handleSave(); setProviderModal(null); }} disabled={saving}>
                          {saving ? 'Guardando...' : `Guardar ${modalDirtyKeys.length} cambio${modalDirtyKeys.length > 1 ? 's' : ''}`}
                        </Button>
                        <Button variant="ghost" onClick={() => { setValues(prev => { const n = {...prev}; modalDirtyKeys.forEach(k => n[k] = originalValues[k]); return n; }); }}>
                          Deshacer
                        </Button>
                      </>
                    ) : (
                      <Button variant="ghost" onClick={() => setProviderModal(null)}>Cerrar</Button>
                    )}
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: PROMPT EDITOR
    // ═══════════════════════════════════════════════════════════════
    function PromptPage() {
      const [sections, setSections] = useState([]);
      const [selected, setSelected] = useState(null);
      const [editContent, setEditContent] = useState('');
      const [editNote, setEditNote] = useState('');
      const [history, setHistory] = useState([]);
      const [showHistory, setShowHistory] = useState(false);
      const [emotional, setEmotional] = useState(null);
      const [preview, setPreview] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [tab, setTab] = useState('Sections');
      const [newSection, setNewSection] = useState({ id: '', name: '', content: '', description: '' });
      const [showNew, setShowNew] = useState(false);

      useEffect(() => {
        Promise.all([
          api('/prompt/sections'),
          api('/prompt/emotional'),
        ]).then(([secData, emoData]) => {
          setSections(secData.sections || []);
          setEmotional(emoData);
          setLoading(false);
        }).catch(() => setLoading(false));
      }, []);

      const selectSection = (s) => {
        setSelected(s);
        setEditContent(s.content);
        setEditNote('');
        setShowHistory(false);
        setHistory([]);
      };

      const saveSection = async () => {
        if (!selected) return;
        setSaving(true);
        try {
          await api(`/prompt/sections/${selected.id}`, {
            method: 'PUT',
            body: JSON.stringify({ content: editContent, note: editNote }),
          });
          const data = await api('/prompt/sections');
          setSections(data.sections || []);
          const updated = (data.sections || []).find(s => s.id === selected.id);
          if (updated) setSelected(updated);
          setEditNote('');
        } catch (err) {
          alert('Error: ' + err.message);
        }
        setSaving(false);
      };

      const toggleSection = async (id, enabled) => {
        await api(`/prompt/sections/${id}/toggle`, {
          method: 'PUT',
          body: JSON.stringify({ enabled }),
        });
        setSections(prev => prev.map(s => s.id === id ? { ...s, enabled: enabled ? 1 : 0 } : s));
      };

      const deleteSection = async (id) => {
        if (!confirm('Eliminar seccion?')) return;
        try {
          await api(`/prompt/sections/${id}`, { method: 'DELETE' });
          setSections(prev => prev.filter(s => s.id !== id));
          if (selected?.id === id) { setSelected(null); setEditContent(''); }
        } catch (err) { alert(err.message); }
      };

      const loadHistory = async (id) => {
        const data = await api(`/prompt/sections/${id}/history`);
        setHistory(data.history || []);
        setShowHistory(true);
      };

      const doRollback = async (sectionId, historyId) => {
        await api(`/prompt/sections/${sectionId}/rollback/${historyId}`, { method: 'POST' });
        const data = await api('/prompt/sections');
        setSections(data.sections || []);
        const updated = (data.sections || []).find(s => s.id === sectionId);
        if (updated) { setSelected(updated); setEditContent(updated.content); }
        setShowHistory(false);
      };

      const loadPreview = async () => {
        const data = await api('/prompt/preview');
        setPreview(data);
      };

      const createSection = async () => {
        if (!newSection.id || !newSection.name || !newSection.content) return;
        try {
          await api('/prompt/sections', { method: 'POST', body: JSON.stringify(newSection) });
          const data = await api('/prompt/sections');
          setSections(data.sections || []);
          setShowNew(false);
          setNewSection({ id: '', name: '', content: '', description: '' });
        } catch (err) { alert(err.message); }
      };

      const setMood = async (emotion) => {
        await api('/prompt/emotional', { method: 'PUT', body: JSON.stringify({ emotion, reason: 'Manual desde dashboard' }) });
        const data = await api('/prompt/emotional');
        setEmotional(data);
      };

      if (loading) return <Spinner />;

      const emotions = ['contento','orgulloso','motivado','neutral','aburrido','extrañando','preocupado','cansado','frustrado','alerta'];
      const emoColors = {
        contento:'bg-green-500', orgulloso:'bg-blue-500', motivado:'bg-cyan-500',
        neutral:'bg-gray-500', aburrido:'bg-yellow-600', extrañando:'bg-purple-500',
        preocupado:'bg-orange-500', cansado:'bg-gray-400', frustrado:'bg-red-500', alerta:'bg-red-600',
      };

      return (
        <div className="fade-in space-y-5">
          <Tabs tabs={['Sections', 'Emotional', 'Preview']} active={tab} onChange={(t) => setTab(t)} />

          {tab === 'Sections' && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
              {/* Section List */}
              <Card className="lg:col-span-1">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-sm font-semibold text-white">Secciones</h3>
                  <Button size="sm" onClick={() => setShowNew(!showNew)}>+ Nueva</Button>
                </div>
                {showNew && (
                  <div className="mb-4 p-3 bg-surface rounded-lg space-y-2">
                    <input placeholder="ID (ej: my_rules)" value={newSection.id} onChange={e => setNewSection(p => ({...p, id: e.target.value}))} className="w-full bg-bg border border-border rounded px-3 py-1.5 text-xs text-white" />
                    <input placeholder="Nombre" value={newSection.name} onChange={e => setNewSection(p => ({...p, name: e.target.value}))} className="w-full bg-bg border border-border rounded px-3 py-1.5 text-xs text-white" />
                    <textarea placeholder="Contenido" value={newSection.content} onChange={e => setNewSection(p => ({...p, content: e.target.value}))} rows={3} className="w-full bg-bg border border-border rounded px-3 py-1.5 text-xs text-white resize-none" />
                    <div className="flex gap-2">
                      <Button size="sm" onClick={createSection}>Crear</Button>
                      <Button size="sm" variant="ghost" onClick={() => setShowNew(false)}>Cancelar</Button>
                    </div>
                  </div>
                )}
                <div className="space-y-1 max-h-[calc(100vh-320px)] overflow-y-auto">
                  {sections.map(s => (
                    <div key={s.id} onClick={() => selectSection(s)}
                      className={`flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer transition-colors ${selected?.id === s.id ? 'bg-accent/10 border border-accent/30' : 'hover:bg-surface'}`}>
                      <div className="flex items-center gap-2 min-w-0">
                        <span className={`w-2 h-2 rounded-full shrink-0 ${s.enabled ? 'bg-green-400' : 'bg-gray-600'}`} />
                        <div className="min-w-0">
                          <p className="text-xs font-medium text-white truncate">{s.name}</p>
                          <p className="text-[10px] text-gray-500 mono">{s.id}</p>
                        </div>
                      </div>
                      {s.locked ? <span className="text-[10px] text-gray-600">bloqueado</span> : null}
                    </div>
                  ))}
                </div>
              </Card>

              {/* Editor */}
              <Card className="lg:col-span-2">
                {selected ? (
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <div>
                        <h3 className="text-sm font-semibold text-white">{selected.name}</h3>
                        <p className="text-[10px] text-gray-500">{selected.description || selected.id}</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <Toggle enabled={!!selected.enabled} onToggle={() => toggleSection(selected.id, !selected.enabled)} />
                        <Button size="sm" variant="ghost" onClick={() => loadHistory(selected.id)}>Historial</Button>
                        {!selected.locked && <Button size="sm" variant="danger" onClick={() => deleteSection(selected.id)}>Eliminar</Button>}
                      </div>
                    </div>
                    {selected.id === 'context' && selected.content === '__DYNAMIC_CONTEXT__' ? (
                      <div className="bg-surface rounded-lg p-4 text-xs text-gray-400">
                        Esta sección se genera dinámicamente (fecha, hora, canal, sesión, detección de ausencia). No se puede editar.
                      </div>
                    ) : (
                      <>
                        <textarea value={editContent} onChange={e => setEditContent(e.target.value)} rows={18}
                          className="w-full bg-surface border border-border rounded-lg p-3 text-xs text-gray-200 mono resize-y leading-relaxed" spellCheck={false} />
                        <div className="flex items-center gap-3 mt-3">
                          <input placeholder="Nota del cambio (opcional)" value={editNote} onChange={e => setEditNote(e.target.value)}
                            className="flex-1 bg-surface border border-border rounded-lg px-3 py-2 text-xs text-white" />
                          <Button onClick={saveSection} disabled={saving || editContent === selected.content}>
                            {saving ? 'Guardando...' : 'Guardar'}
                          </Button>
                        </div>
                      </>
                    )}
                    {showHistory && (
                      <div className="mt-4 border-t border-border pt-4">
                        <h4 className="text-xs font-semibold text-gray-400 mb-3">Historial de Versiones</h4>
                        {history.length === 0 ? <p className="text-xs text-gray-500">Sin historial aún.</p> : (
                          <div className="space-y-2 max-h-60 overflow-y-auto">
                            {history.map(h => (
                              <div key={h.id} className="flex items-center justify-between bg-surface rounded-lg px-3 py-2">
                                <div>
                                  <p className="text-[10px] text-gray-400">{formatDate(h.created_at)}</p>
                                  <p className="text-[10px] text-gray-500">{h.change_note || 'Sin nota'}</p>
                                </div>
                                <Button size="sm" variant="ghost" onClick={() => doRollback(selected.id, h.id)}>Revertir</Button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ) : (
                  <EmptyState message="Selecciona una sección para editar" />
                )}
              </Card>
            </div>
          )}

          {tab === 'Emotional' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <Card>
                <h3 className="text-sm font-semibold text-white mb-4">Estado Actual</h3>
                {emotional ? (
                  <div className="space-y-4">
                    <div className="flex items-center gap-3">
                      <span className={`w-4 h-4 rounded-full ${emoColors[emotional.current] || 'bg-gray-500'}`} />
                      <span className="text-lg font-medium text-white capitalize">{emotional.current}</span>
                      <span className="text-xs text-gray-400">intensidad: {emotional.intensity?.toFixed(2)}</span>
                    </div>
                    <p className="text-xs text-gray-400">{emotional.reason}</p>
                    <p className="text-[10px] text-gray-600">Desde: {formatDate(emotional.since)}</p>
                    {emotional.history?.length > 0 && (
                      <div className="mt-4">
                        <h4 className="text-xs font-semibold text-gray-400 mb-2">Historial Reciente</h4>
                        <div className="space-y-1 max-h-48 overflow-y-auto">
                          {emotional.history.slice(0, 10).map((h, i) => (
                            <div key={i} className="flex items-center gap-2 text-[10px]">
                              <span className={`w-2 h-2 rounded-full ${emoColors[h.emotion] || 'bg-gray-500'}`} />
                              <span className="text-gray-300 capitalize">{h.emotion}</span>
                              <span className="text-gray-500">{h.reason}</span>
                              <span className="text-gray-600 ml-auto">{formatDate(h.timestamp)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ) : <p className="text-xs text-gray-500">Motor emocional deshabilitado</p>}
              </Card>
              <Card>
                <h3 className="text-sm font-semibold text-white mb-4">Establecer Estado</h3>
                <div className="grid grid-cols-2 gap-2">
                  {emotions.map(e => (
                    <button key={e} onClick={() => setMood(e)}
                      className={`flex items-center gap-2 px-3 py-2 rounded-lg text-xs transition-colors ${emotional?.current === e ? 'bg-accent/20 text-accent border border-accent/30' : 'bg-surface text-gray-400 hover:text-white hover:bg-card'}`}>
                      <span className={`w-2.5 h-2.5 rounded-full ${emoColors[e]}`} />
                      <span className="capitalize">{e}</span>
                    </button>
                  ))}
                </div>
              </Card>
            </div>
          )}

          {tab === 'Preview' && (
            <Card>
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-sm font-semibold text-white">Vista Previa del System Prompt</h3>
                <div className="flex items-center gap-3">
                  {preview && <span className="text-xs text-gray-500 mono">~{preview.tokenEstimate} tokens</span>}
                  <Button size="sm" onClick={loadPreview}>{preview ? 'Actualizar' : 'Cargar Vista Previa'}</Button>
                </div>
              </div>
              {preview ? (
                <pre className="bg-surface rounded-lg p-4 text-xs text-gray-300 mono whitespace-pre-wrap leading-relaxed max-h-[calc(100vh-300px)] overflow-y-auto">{preview.prompt}</pre>
              ) : (
                <EmptyState message="Haz clic en 'Cargar Vista Previa' para ver el prompt ensamblado" />
              )}
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAGE: ANALYTICS
    // ═══════════════════════════════════════════════════════════════
    function AnalyticsPage() {
      const [overview, setOverview] = useState(null);
      const [tools, setTools] = useState([]);
      const [agents, setAgents] = useState([]);
      const [emotions, setEmotions] = useState([]);
      const [tab, setTab] = useState('overview');
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        Promise.all([
          api('/analytics/overview').catch(() => null),
          api('/analytics/tools').catch(() => ({})),
          api('/analytics/agents').catch(() => ({})),
          api('/analytics/emotions').catch(() => ({})),
        ]).then(([o, t, a, e]) => {
          setOverview(o); setTools((t && t.toolUsage) || []); setAgents((a && a.agentUsage) || []); setEmotions((e && e.distribution) || []);
          setLoading(false);
        });
      }, []);

      if (loading) return <Spinner />;

      const tabs = ['overview', 'tools', 'agents', 'emotions'];
      const maxToolCount = Math.max(1, ...tools.map(t => t.count || 0));
      const maxAgentCount = Math.max(1, ...agents.map(a => a.count || 0));
      const maxEmotionCount = Math.max(1, ...emotions.map(e => e.count || 0));

      return (
        <div className="fade-in space-y-6">
          <div className="flex gap-2 flex-wrap">
            {tabs.map(t => (
              <button key={t} onClick={() => setTab(t)}
                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-colors ${tab === t ? 'bg-accent text-black' : 'bg-surface text-gray-400 hover:text-white'}`}>
                {t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            ))}
          </div>

          {tab === 'overview' && overview && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <StatCard label="Mensajes Hoy" value={overview.todayMessages ?? 0} />
                <StatCard label="Tokens Prom/Resp" value={overview.avgTokensPerResponse ?? 0} />
                <StatCard label="Tokens Totales" value={overview.totalTokens ?? 0} />
                <StatCard label="Sesiones Hoy" value={overview.activeSessionsToday ?? 0} />
              </div>
              {overview.messagesPerDay && overview.messagesPerDay.length > 0 && (
                <Card>
                  <h3 className="text-sm font-semibold text-white mb-4">Mensajes por Día (últimos 30 días)</h3>
                  <div className="flex items-end gap-1 h-32">
                    {overview.messagesPerDay.slice(-14).map((d, i) => {
                      const max = Math.max(1, ...overview.messagesPerDay.map(x => x.count));
                      const h = Math.max(4, (d.count / max) * 100);
                      return (
                        <div key={i} className="flex-1 flex flex-col items-center gap-1">
                          <span className="text-[10px] text-gray-500">{d.count}</span>
                          <div className="w-full bg-accent/60 rounded-t" style={{ height: h + '%' }} title={d.day} />
                          <span className="text-[9px] text-gray-600 truncate w-full text-center">{(d.day || '').slice(5)}</span>
                        </div>
                      );
                    })}
                  </div>
                </Card>
              )}

          )}

          {tab === 'tools' && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">Uso de Herramientas</h3>
              {tools.length === 0 ? <EmptyState message="Sin datos de uso aún" /> : (
                <div className="space-y-2">
                  {tools.map((t, i) => (
                    <div key={i} className="flex items-center gap-3">
                      <span className="text-xs text-gray-400 w-32 truncate mono">{t.tool}</span>
                      <div className="flex-1 bg-surface rounded-full h-5 overflow-hidden">
                        <div className="bg-accent/60 h-full rounded-full flex items-center px-2" style={{ width: ((t.count / maxToolCount) * 100) + '%' }}>
                          <span className="text-[10px] text-white">{t.count}</span>
                        </div>
                      </div>
                      <span className="text-xs text-gray-500 w-16 text-right">{((t.successRate ?? 1) * 100).toFixed(0)}% ok</span>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          )}

          {tab === 'agents' && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">Uso de Agentes</h3>
              {agents.length === 0 ? <EmptyState message="Sin datos de agentes aún" /> : (
                <div className="space-y-2">
                  {agents.map((a, i) => (
                    <div key={i} className="flex items-center gap-3">
                      <span className="text-xs text-gray-400 w-32 truncate">{a.agent_id || a.agent}</span>
                      <div className="flex-1 bg-surface rounded-full h-5 overflow-hidden">
                        <div className="bg-purple-500/60 h-full rounded-full flex items-center px-2" style={{ width: ((a.count / maxAgentCount) * 100) + '%' }}>
                          <span className="text-[10px] text-white">{a.count}</span>
                        </div>
                      </div>
                      <span className="text-xs text-gray-500 w-20 text-right">conf: {(a.avgConfidence ?? 0).toFixed(0)}%</span>
                    </div>
                  ))}
                </div>
              )}

          )}

          {tab === 'emotions' && (
            <Card>
              <h3 className="text-sm font-semibold text-white mb-4">Distribución Emocional</h3>
              {emotions.length === 0 ? <EmptyState message="Sin datos emocionales aún" /> : (
                <div className="space-y-2">
                  {emotions.map((e, i) => (
                    <div key={i} className="flex items-center gap-3">
                      <span className="text-xs text-gray-400 w-28">{e.emotion}</span>
                      <div className="flex-1 bg-surface rounded-full h-5 overflow-hidden">
                        <div className="bg-yellow-500/60 h-full rounded-full flex items-center px-2" style={{ width: ((e.count / maxEmotionCount) * 100) + '%' }}>
                          <span className="text-[10px] text-white">{e.count}</span>
