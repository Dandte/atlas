<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- Glow -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <!-- Middle ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
  <!-- Core -->
  <circle cx="100" cy="100" r="18" fill="#0a0a14" stroke="#00d4ff" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="8" fill="#00d4ff" filter="url(#blur)"/>
  <circle cx="100" cy="100" r="5" fill="#00d4ff"/>
  <!-- Orbital dots -->
  <circle cx="100" cy="20" r="3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="169" cy="60" r="3" fill="#00ff88" opacity="0.6"/>
  <circle cx="169" cy="140" r="3" fill="#ffd700" opacity="0.6"/>
  <circle cx="100" cy="180" r="3" fill="#ff69b4" opacity="0.6"/>
  <circle cx="31" cy="140" r="3" fill="#aa88ff" opacity="0.6"/>
  <circle cx="31" cy="60" r="3" fill="#ff6b35" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="100" y1="20" x2="100" y2="60" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="169" y1="60" x2="140" y2="80" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
  <line x1="169" y1="140" x2="140" y2="120" stroke="#ffd700" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="180" x2="100" y2="140" stroke="#ff69b4" stroke-width="0.5" opacity="0.3"/>
  <line x1="31" y1="140" x2="60" y2="120" stroke="#aa88ff" stroke-width="0.5" opacity="0.3"/>
  <line x1="31" y1="60" x2="60" y2="80" stroke="#ff6b35" stroke-width="0.5" opacity="0.3"/>
</svg>
